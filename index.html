<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Meiting Chat</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root {
    --bg: #eef8f6;
    --bg-2: #e3f3ef;
    --panel-bg: rgba(255,255,255,0.72);
    --surface: #ffffff;
    --surface-hover: #f3fbfa;
    --accent: #3fa392;
    --accent-hover: #328579;
    --text: #2f3d3a;
    --text-soft: #7d928d;
    --border-soft: #cfe6e0;
    --bubble-ai-bg: #dceeff;
    --bubble-user-bg: #dcf6e1;
    --bubble-border: rgba(25, 45, 40, 0.10);
    --thinking-bg: #eef4f6;
    --thinking-border: #cfe1e6;
    --thinking-accent: #5c7d86;
    --disabled-bg: #bcd9d3;
    --danger-hover-bg: #fde2e2;
    --danger-hover-text: #c0574f;
  }
  :root[data-theme="dark"] {
    --bg: #141e1b;
    --bg-2: #0f1715;
    --panel-bg: rgba(20, 30, 27, 0.75);
    --surface: #1c2925;
    --surface-hover: #24332e;
    --accent: #4fc2ae;
    --accent-hover: #63d1bd;
    --text: #e7f2ef;
    --text-soft: #93aaa5;
    --border-soft: #2b3f3a;
    --bubble-border: rgba(255, 255, 255, 0.08);
    --thinking-bg: #1c2b28;
    --thinking-border: #33473f;
    --thinking-accent: #8fb4bb;
    --disabled-bg: #2b3d38;
    --danger-hover-bg: #3a2323;
    --danger-hover-text: #e08b83;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    color: var(--text);
    overflow: hidden;
    transition: background 0.2s ease, color 0.2s ease;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #app {
    display: flex;
    flex-direction: row;
    height: 100vh;
    height: 100dvh;
  }

  /* ---------- Sidebar ---------- */
  #sidebar {
    width: 260px;
    flex-shrink: 0;
    background: var(--panel-bg);
    border-right: 1px solid var(--border-soft);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    margin-left: -260px;
    transition: margin-left 0.22s ease;
  }
  #app.sidebar-open #sidebar { margin-left: 0; }
  #sidebar-header {
    padding: 12px;
    border-bottom: 1px solid var(--border-soft);
  }
  #new-conv-btn {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    font-size: 13px;
  }
  #new-conv-btn:hover:not(:disabled) { background: var(--accent-hover); }
  #export-import-row { display: flex; gap: 6px; margin-top: 8px; }
  #export-import-row button {
    flex: 1;
    padding: 7px 0;
    border-radius: 8px;
    border: 1px solid var(--border-soft);
    background: transparent;
    color: var(--text-soft);
    font-size: 12px;
    cursor: pointer;
  }
  #export-import-row button:hover { background: var(--surface-hover); color: var(--accent); }
  #nav-menu {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 8px;
    border-bottom: 1px solid var(--border-soft);
    flex-shrink: 0;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 9px 12px;
    border-radius: 10px;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    text-align: left;
  }
  .nav-item:hover { background: rgba(63, 163, 146, 0.10); }
  .nav-item.active {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    font-weight: 600;
    color: var(--accent);
  }
  .nav-icon { font-size: 15px; width: 18px; text-align: center; flex-shrink: 0; }
  #conv-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  #conv-list.disabled { pointer-events: none; opacity: 0.55; }
  .conv-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text);
    margin-bottom: 4px;
  }
  .conv-item:hover { background: rgba(63, 163, 146, 0.10); }
  .conv-item.active {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    font-weight: 600;
  }
  .conv-title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .conv-delete {
    border: none;
    background: transparent;
    color: var(--text-soft);
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    padding: 4px 7px;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .conv-delete:hover { background: var(--danger-hover-bg); color: var(--danger-hover-text); }

  #sidebar-backdrop { display: none; }

  /* ---------- Main column ---------- */
  #main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
  }

  header {
    padding: 14px 20px;
    background: var(--panel-bg);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--border-soft);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    color: var(--accent);
    white-space: nowrap;
  }
  header input[type="password"], header input[type="text"] {
    flex: 1;
    min-width: 160px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid var(--border-soft);
    background: var(--surface);
    font-size: 13px;
    outline: none;
    color: var(--text);
  }
  header input[type="password"]:focus, header input[type="text"]:focus { border-color: var(--accent); }
  header select {
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid var(--border-soft);
    background: var(--surface);
    font-size: 13px;
    outline: none;
    color: var(--text);
    cursor: pointer;
    flex-shrink: 0;
  }
  header button {
    padding: 8px 14px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  header button:hover:not(:disabled) { background: var(--accent-hover); }
  header button.secondary {
    background: transparent;
    color: var(--text-soft);
    border: 1px solid var(--border-soft);
  }
  header button.secondary:hover:not(:disabled) { background: var(--surface); color: var(--accent); }
  #sidebar-toggle-btn, #theme-toggle-btn {
    width: 38px;
    height: 38px;
    padding: 0;
    font-size: 16px;
    flex-shrink: 0;
  }

  #totals-bar {
    text-align: center;
    font-size: 12px;
    color: var(--text-soft);
    padding: 6px 12px;
    background: rgba(255,255,255,0.5);
    border-bottom: 1px solid var(--border-soft);
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 20px 12%;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .msg-row {
    display: flex;
    width: 100%;
    gap: 8px;
    align-items: flex-start;
  }
  .msg-row.ai { justify-content: flex-start; }
  .msg-row.user { justify-content: flex-end; }

  .msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    cursor: pointer;
    border: 1px solid var(--border-soft);
    background: var(--surface);
  }

  .msg-stack {
    display: flex;
    flex-direction: column;
    max-width: 72%;
    min-width: 0;
  }
  .msg-row.ai .msg-stack { align-items: flex-start; }
  .msg-row.user .msg-stack { align-items: flex-end; }

  .msg-nickname {
    font-size: 11.5px;
    line-height: 14px;
    color: var(--text-soft);
    margin-bottom: 3px;
    padding: 0 4px;
  }
  /* 头像要对齐气泡框顶部，不是对齐"网名+气泡"整个堆叠的顶部——网名行占的
     14px 行高 + 3px margin-bottom 得让头像往下让开，正好让到气泡框顶边。
     只在有网名行的消息行里生效（用 :has 限定），打字指示器那种没有网名行的
     消息行不受影响，头像照旧贴着堆叠顶部（此时堆叠顶部就是气泡顶部）。 */
  .msg-row:has(.msg-nickname) .msg-avatar {
    margin-top: 17px;
  }

  .bubble {
    max-width: 100%;
    padding: 12px 16px;
    border-radius: 18px;
    line-height: 1.55;
    font-size: 14.5px;
    word-break: break-word;
    box-shadow: 0 2px 6px rgba(60, 90, 80, 0.08);
    border: 1px solid var(--bubble-border);
    color: var(--text);
  }
  .msg-highlight .bubble { animation: msg-highlight-flash 1.5s ease; }
  @keyframes msg-highlight-flash {
    0% { box-shadow: 0 0 0 3px var(--accent); }
    100% { box-shadow: 0 2px 6px rgba(60, 90, 80, 0.08); }
  }
  .msg-row.ai .bubble {
    background: var(--bubble-ai-bg);
    border-top-left-radius: 4px;
  }
  .msg-row.user .bubble {
    background: var(--bubble-user-bg);
    border-top-right-radius: 4px;
    white-space: pre-wrap;
  }

  .msg-images {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 8px;
  }
  .msg-images img {
    max-width: 160px;
    max-height: 160px;
    border-radius: 10px;
    object-fit: cover;
    border: 1px solid rgba(0,0,0,0.08);
  }

  /* ---------- Typing indicator ---------- */
  .typing-bubble {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .typing-label {
    font-size: 12.5px;
    color: var(--text-soft);
    font-style: italic;
  }
  .typing-dots { display: inline-flex; gap: 4px; }
  .typing-dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-soft);
    animation: typing-bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typing-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* ---------- Markdown rendering ---------- */
  .msg-markdown p { margin: 0 0 8px 0; }
  .msg-markdown p:last-child { margin-bottom: 0; }
  .msg-markdown ul, .msg-markdown ol { margin: 4px 0 8px 22px; padding: 0; }
  .msg-markdown li { margin-bottom: 4px; }
  .msg-markdown h1, .msg-markdown h2, .msg-markdown h3, .msg-markdown h4 {
    margin: 12px 0 6px; color: var(--accent-hover); line-height: 1.3;
  }
  .msg-markdown h1:first-child, .msg-markdown h2:first-child, .msg-markdown h3:first-child { margin-top: 0; }
  .msg-markdown h1 { font-size: 18px; }
  .msg-markdown h2 { font-size: 16.5px; }
  .msg-markdown h3 { font-size: 15px; }
  .msg-markdown code {
    background: rgba(0,0,0,0.07);
    padding: 2px 5px;
    border-radius: 5px;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 0.88em;
  }
  .msg-markdown pre {
    background: #26343a;
    color: #eaf5f2;
    padding: 12px 14px;
    border-radius: 10px;
    overflow-x: auto;
    margin: 8px 0;
  }
  .msg-markdown pre code { background: none; padding: 0; color: inherit; }
  .msg-markdown blockquote {
    border-left: 3px solid var(--border-soft);
    margin: 8px 0; padding: 2px 12px; color: var(--text-soft);
  }
  .msg-markdown a { color: var(--accent-hover); }
  .msg-markdown table { border-collapse: collapse; margin: 8px 0; max-width: 100%; display: block; overflow-x: auto; }
  .msg-markdown th, .msg-markdown td { border: 1px solid var(--border-soft); padding: 4px 8px; }
  .msg-markdown hr { border: none; border-top: 1px solid var(--border-soft); margin: 10px 0; }

  /* ---------- Thinking disclosure (claude.ai style) ---------- */
  details.thinking {
    margin-bottom: 10px;
    background: var(--thinking-bg);
    border: 1px solid var(--thinking-border);
    border-radius: 10px;
    padding: 0 10px;
  }
  details.thinking summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 9px 0;
    outline: none;
    user-select: none;
  }
  details.thinking summary::-webkit-details-marker { display: none; }
  .thinking-arrow {
    display: inline-block;
    font-size: 10px;
    color: var(--thinking-accent);
    transition: transform 0.18s ease;
    flex-shrink: 0;
  }
  details.thinking[open] .thinking-arrow { transform: rotate(90deg); }
  .thinking-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--thinking-accent);
    flex-shrink: 0;
  }
  .thinking-preview {
    font-size: 12px;
    color: var(--text-soft);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
  }
  details.thinking[open] .thinking-preview { display: none; }
  .thinking-body {
    font-size: 12.5px;
    color: var(--text-soft);
    white-space: pre-wrap;
    line-height: 1.5;
    border-top: 1px dashed var(--thinking-border);
    padding: 8px 0 10px;
  }

  .status {
    text-align: center;
    color: var(--text-soft);
    font-size: 12.5px;
    padding: 4px 0;
  }

  .msg-usage {
    margin-top: 8px;
    font-size: 11px;
    color: var(--text-soft);
    opacity: 0.85;
  }
  .msg-time {
    margin-top: 4px;
    font-size: 10.5px;
    color: var(--text-soft);
    opacity: 0.7;
  }

  footer {
    padding: 12px 12%;
    background: var(--panel-bg);
    border-top: 1px solid var(--border-soft);
  }
  #preview-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .preview-thumb {
    position: relative;
    width: 56px;
    height: 56px;
  }
  .preview-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--border-soft);
  }
  .preview-thumb .remove {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 12px;
    line-height: 18px;
    text-align: center;
    cursor: pointer;
  }
  #input-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
  }
  #input-row textarea {
    flex: 1;
    resize: none;
    border-radius: 16px;
    border: 1px solid var(--border-soft);
    padding: 10px 14px;
    font-size: 14.5px;
    font-family: inherit;
    outline: none;
    max-height: 140px;
    min-height: 42px;
    background: var(--surface);
    color: var(--text);
  }
  #input-row textarea:focus { border-color: var(--accent); }
  .icon-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid var(--border-soft);
    background: var(--surface);
    color: var(--text-soft);
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--surface-hover); }
  #send-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #send-btn:disabled {
    background: var(--disabled-bg);
    cursor: not-allowed;
  }
  #send-btn:hover:not(:disabled) { background: var(--accent-hover); }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(30, 50, 45, 0.32);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 300;
  }
  .modal-overlay[hidden] { display: none; }
  .modal-card {
    background: var(--surface);
    border-radius: 16px;
    border: 1px solid var(--border-soft);
    padding: 20px;
    width: min(520px, 90vw);
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 8px 24px rgba(40, 70, 60, 0.18);
  }
  .modal-card h2 {
    margin: 0 0 14px 0;
    font-size: 16px;
    color: var(--accent);
  }
  .settings-section { margin-bottom: 18px; }
  .settings-section:last-of-type { margin-bottom: 0; }
  .settings-label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-soft);
    margin-bottom: 8px;
  }
  .modal-card textarea {
    width: 100%;
    min-height: 130px;
    border-radius: 12px;
    border: 1px solid var(--border-soft);
    padding: 10px 12px;
    font-size: 13.5px;
    font-family: inherit;
    resize: vertical;
    outline: none;
    color: var(--text);
    background: var(--surface);
  }
  .modal-card textarea:focus { border-color: var(--accent); }
  .settings-text-input {
    width: 100%;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid var(--border-soft);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    outline: none;
    box-sizing: border-box;
    margin-bottom: 6px;
  }
  .settings-text-input:focus { border-color: var(--accent); }
  .context-trim-count-row {
    display: flex; align-items: center; gap: 8px;
    margin-top: 10px; font-size: 13px; color: var(--text);
  }
  .context-trim-count-row input[type="number"] {
    width: 80px; padding: 6px 8px; border-radius: 8px;
    border: 1px solid var(--border-soft); background: var(--surface);
    color: var(--text); font-size: 13px; outline: none;
  }
  .context-trim-count-row input[type="number"]:focus { border-color: var(--accent); }
  .color-row {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
  }
  .color-field {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text);
  }
  .color-field input[type="color"] {
    width: 34px;
    height: 34px;
    padding: 0;
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    cursor: pointer;
    background: none;
  }
  #reset-colors-btn {
    margin-left: auto;
    padding: 7px 12px;
    font-size: 12px;
  }
  .toggle-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    line-height: 1.4;
  }
  .toggle-row input[type="checkbox"] {
    width: 18px;
    height: 18px;
    margin-top: 1px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }
  .toggle-hint {
    display: block;
    font-size: 11.5px;
    color: var(--text-soft);
    margin-top: 2px;
  }
  .quality-row { display: flex; align-items: center; gap: 10px; }
  .quality-row input[type="range"] { flex: 1; accent-color: var(--accent); }
  .quality-row span { font-size: 12.5px; color: var(--text-soft); min-width: 34px; text-align: right; }

  /* ---------- Export conversation picker ---------- */
  .export-select-row {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--text); margin-bottom: 10px; cursor: pointer;
  }
  .export-select-row input { accent-color: var(--accent); }
  .export-conv-list {
    max-height: 260px; overflow-y: auto;
    border: 1px solid var(--border-soft); border-radius: 10px;
    padding: 6px; margin-bottom: 4px;
  }
  .export-conv-item {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 8px; border-radius: 8px;
    font-size: 13px; color: var(--text); cursor: pointer;
  }
  .export-conv-item:hover { background: var(--surface-hover); }
  .export-conv-item input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; flex-shrink: 0; }

  /* ---------- Milestones / together-days ---------- */
  #together-days-bar {
    text-align: center;
    font-size: 12.5px;
    color: var(--accent-hover);
    padding: 6px 12px;
    background: rgba(255,255,255,0.5);
    border-bottom: 1px solid var(--border-soft);
  }
  .together-days-row {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 16px; padding-bottom: 14px;
    border-bottom: 1px dashed var(--border-soft);
  }
  .together-days-count { font-size: 14px; font-weight: 600; color: var(--accent-hover); }
  .together-days-edit { display: flex; align-items: center; gap: 6px; }
  .together-days-edit input[type="date"] {
    padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border-soft);
    background: var(--surface); color: var(--text); font-size: 12.5px; outline: none;
  }
  .together-days-edit button {
    padding: 6px 10px; border-radius: 8px; border: none;
    background: var(--accent); color: #fff; font-size: 12px; cursor: pointer;
  }
  .together-days-edit button:hover { background: var(--accent-hover); }
  .milestone-list { max-height: 320px; overflow-y: auto; }
  .milestone-item {
    padding: 10px 12px; border: 1px solid var(--border-soft); border-radius: 10px;
    margin-bottom: 8px; background: var(--surface);
  }
  .milestone-item-date { font-size: 11.5px; color: var(--text-soft); margin-bottom: 3px; }
  .milestone-item-text { font-size: 13px; color: var(--text); white-space: pre-wrap; }
  .milestone-item-note { font-size: 12.5px; color: var(--accent-hover); margin-top: 5px; }
  .milestone-heart { font-size: 11px; cursor: help; }

  /* ---------- Diary ---------- */
  .diary-save-btn {
    display: block;
    margin-top: 8px;
    padding: 4px 10px;
    border-radius: 8px;
    border: 1px solid var(--border-soft);
    background: transparent;
    color: var(--text-soft);
    font-size: 11.5px;
    cursor: pointer;
  }
  .diary-save-btn:hover:not(:disabled) { background: var(--surface-hover); color: var(--accent); }
  .diary-save-btn:disabled { opacity: 0.6; cursor: default; }
  .diary-list { max-height: 340px; overflow-y: auto; }
  .diary-item {
    padding: 10px 12px; border: 1px solid var(--border-soft); border-radius: 10px;
    margin-bottom: 8px; background: var(--surface); cursor: pointer;
  }
  .diary-item:hover { border-color: var(--accent); }
  .diary-item-date { font-size: 11.5px; color: var(--text-soft); margin-bottom: 3px; }
  .diary-item-conv { font-size: 11.5px; color: var(--accent-hover); margin-bottom: 4px; }
  .diary-item-preview { font-size: 13px; color: var(--text); white-space: pre-wrap; }
  .anniversary-card { text-align: center; }
  .anniversary-emoji { font-size: 40px; line-height: 1.2; }
  .anniversary-card p { color: var(--text-soft); font-size: 13px; }

  /* ---------- Voice input ---------- */
  #mic-btn.recording {
    background: #e85a5a;
    color: #fff;
    border-color: #e85a5a;
    animation: mic-pulse 1.2s infinite;
  }
  @keyframes mic-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(232, 90, 90, 0.5); }
    50% { box-shadow: 0 0 0 6px rgba(232, 90, 90, 0); }
  }

  /* ---------- Drag & drop / paste image overlay ---------- */
  #drop-overlay {
    position: fixed;
    inset: 0;
    z-index: 500;
    background: rgba(63, 163, 146, 0.16);
    backdrop-filter: blur(2px);
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  #drop-overlay[hidden] { display: none; }
  #drop-overlay-text {
    padding: 20px 36px;
    border-radius: 18px;
    border: 3px dashed var(--accent);
    background: var(--surface);
    color: var(--accent-hover);
    font-size: 18px;
    font-weight: 600;
  }

  /* ---------- Files browser (per conversation) ---------- */
  .files-filter-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
  .files-filter-row input[type="text"] {
    flex: 1; padding: 8px 12px; border-radius: 10px;
    border: 1px solid var(--border-soft); background: var(--surface);
    color: var(--text); font-size: 13px; outline: none;
  }
  .files-filter-row select, .files-filter-row input[type="date"] {
    padding: 7px 8px; border-radius: 10px; border: 1px solid var(--border-soft);
    background: var(--surface); color: var(--text); font-size: 12.5px; outline: none;
  }
  .files-filter-row span { font-size: 12px; color: var(--text-soft); }
  .files-grid {
    max-height: 360px; overflow-y: auto;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 10px; padding: 2px;
  }
  .files-grid-empty { grid-column: 1 / -1; text-align: center; color: var(--text-soft); font-size: 12.5px; padding: 24px 0; }
  .file-thumb {
    position: relative; border-radius: 10px; overflow: hidden;
    border: 1px solid var(--border-soft); cursor: pointer;
    aspect-ratio: 1 / 1; background: var(--surface);
  }
  .file-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .file-thumb-date {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.55); color: #fff;
    font-size: 9.5px; padding: 2px 4px; text-align: center;
  }
  .file-thumb-actions {
    position: absolute; top: 3px; right: 3px;
    display: flex; gap: 3px;
  }
  .file-thumb-action {
    background: rgba(0,0,0,0.55); color: #fff; border: none;
    border-radius: 6px; font-size: 11px; padding: 2px 5px; cursor: pointer;
    line-height: 1.4;
  }
  .file-thumb-action:hover { background: rgba(0,0,0,0.78); }
  .file-thumb-action-danger:hover { background: #c0574f; }
  .file-preview-card { position: relative; max-width: 90vw; max-height: 90vh; }
  .file-preview-card img { max-width: 90vw; max-height: 90vh; border-radius: 10px; display: block; }
  #file-preview-close {
    position: absolute; top: -14px; right: -14px;
    width: 30px; height: 30px; border-radius: 50%; border: none;
    background: #fff; color: #333; font-size: 15px; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  /* ---------- Profile editing (in settings) ---------- */
  .profile-edit-row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .profile-edit-field {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 180px;
  }
  .profile-avatar-preview {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    object-fit: cover;
    cursor: pointer;
    border: 1px solid var(--border-soft);
    flex-shrink: 0;
    background: var(--surface);
  }
  .profile-edit-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
    min-width: 0;
  }
  .profile-edit-info span {
    font-size: 11px;
    color: var(--text-soft);
  }
  .profile-edit-info input[type="text"] {
    padding: 6px 9px;
    border-radius: 8px;
    border: 1px solid var(--border-soft);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    outline: none;
    width: 100%;
  }
  .profile-edit-info input[type="text"]:focus { border-color: var(--accent); }

  /* ---------- Profile card (click an avatar) ---------- */
  .profile-card { width: min(380px, 90vw); }
  .profile-bg {
    margin: -20px -20px 0 -20px;
    height: 110px;
    border-radius: 16px 16px 0 0;
    background: linear-gradient(135deg, var(--bubble-ai-bg), var(--bubble-user-bg));
    background-size: cover;
    background-position: center;
    position: relative;
  }
  .profile-bg-btn {
    position: absolute;
    right: 10px;
    bottom: 10px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: rgba(0, 0, 0, 0.45);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  .profile-bg-btn:hover { background: rgba(0, 0, 0, 0.6); }
  .profile-card-body {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .profile-card-avatar {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid var(--surface);
    margin-top: -42px;
    background: var(--surface);
    cursor: pointer;
    position: relative;
    z-index: 1;
  }
  .profile-card-name {
    margin-top: 10px;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    text-align: center;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    padding: 4px 8px;
    font-family: inherit;
    outline: none;
    width: 100%;
    box-sizing: border-box;
  }
  .profile-card-name:hover, .profile-card-name:focus { border-color: var(--border-soft); background: var(--surface); }
  .profile-card-bio {
    width: 100%;
    margin-top: 10px;
    min-height: 50px;
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
    color: var(--text-soft);
    background: var(--surface);
    resize: vertical;
    outline: none;
    text-align: center;
    box-sizing: border-box;
  }
  .profile-card-bio:focus { border-color: var(--accent); }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
  }
  .modal-actions button {
    padding: 8px 16px;
    border-radius: 10px;
    border: none;
    font-size: 13px;
    cursor: pointer;
  }
  .modal-actions .primary { background: var(--accent); color: #fff; }
  .modal-actions .primary:hover { background: var(--accent-hover); }
  .modal-actions .secondary { background: transparent; color: var(--text-soft); border: 1px solid var(--border-soft); }
  .modal-actions .secondary:hover { background: var(--surface-hover); }

  /* ---------- Memory library (记忆库) ---------- */
  .memory-search-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .memory-search-row input {
    flex: 1;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid var(--border-soft);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    outline: none;
  }
  .memory-search-row input:focus { border-color: var(--accent); }
  .memory-search-row button {
    padding: 8px 16px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .memory-search-row button:hover:not(:disabled) { background: var(--accent-hover); }
  .memory-results { max-height: 340px; overflow-y: auto; }
  .memory-result-item {
    padding: 10px 12px;
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
    white-space: pre-wrap;
    background: var(--surface);
  }
  .memory-status { text-align: center; color: var(--text-soft); font-size: 12.5px; padding: 10px 0; }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%) translateY(8px);
    background: rgba(30, 40, 38, 0.88);
    color: #fff;
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 13px;
    z-index: 400;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ---------- Mobile ---------- */
  @media (max-width: 800px) {
    #sidebar {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 250;
      margin-left: -280px;
      width: 280px;
      box-shadow: 4px 0 20px rgba(0,0,0,0.2);
    }
    #app.sidebar-open #sidebar { margin-left: 0; }
    #app.sidebar-open #sidebar-backdrop {
      display: block;
      position: fixed;
      inset: 0;
      background: rgba(20, 35, 30, 0.35);
      z-index: 240;
    }
    header { padding: 10px 12px; gap: 8px; }
    header h1 { font-size: 15px; }
    #chat { padding: 14px 4%; }
    footer { padding: 10px 4%; }
    .msg-stack { max-width: 82%; }
    .msg-avatar { width: 28px; height: 28px; }
    .msg-images img { max-width: 130px; max-height: 130px; }
  }
  @media (max-width: 480px) {
    header input[type="password"] { min-width: 120px; font-size: 12px; }
    header select { font-size: 12px; padding: 8px; }
    header button.secondary { padding: 8px 10px; font-size: 12px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <button id="new-conv-btn">＋ 新建对话</button>
      <div id="export-import-row">
        <button type="button" id="export-conv-btn">导出对话</button>
        <button type="button" id="import-conv-btn">导入对话</button>
        <input type="file" id="import-conv-input" accept="application/json,.json" style="display:none">
      </div>
    </div>
    <nav id="nav-menu">
      <button type="button" class="nav-item active" data-nav="chat"><span class="nav-icon">💬</span><span class="nav-label">聊天</span></button>
      <button type="button" class="nav-item" data-nav="memory"><span class="nav-icon">🧠</span><span class="nav-label">记忆库</span></button>
      <button type="button" class="nav-item" data-nav="diary"><span class="nav-icon">📔</span><span class="nav-label">日记</span></button>
      <button type="button" class="nav-item" data-nav="slowletter"><span class="nav-icon">💌</span><span class="nav-label">慢信</span></button>
      <button type="button" class="nav-item" data-nav="album"><span class="nav-icon">🖼️</span><span class="nav-label">相册</span></button>
      <button type="button" class="nav-item" data-nav="period"><span class="nav-icon">🩸</span><span class="nav-label">经期</span></button>
      <button type="button" class="nav-item" data-nav="milestone"><span class="nav-icon">🚩</span><span class="nav-label">里程碑</span></button>
      <button type="button" class="nav-item" data-nav="settings"><span class="nav-icon">⚙️</span><span class="nav-label">设置</span></button>
    </nav>
    <div id="conv-list"></div>
  </div>
  <div id="sidebar-backdrop"></div>

  <div id="main">
    <header>
      <button class="secondary" id="sidebar-toggle-btn" title="对话列表">☰</button>
      <h1>Meiting Chat</h1>
      <select id="model-select">
        <option value="claude-opus-4-6">claude-opus-4-6</option>
        <option value="claude-sonnet-4-20250514">claude-sonnet-4-20250514</option>
        <option value="deepseek-chat">DeepSeek Chat（备线）</option>
        <option value="deepseek-reasoner">DeepSeek Reasoner（备线）</option>
      </select>
      <input type="password" id="api-key" placeholder="填入七牛云 API Key (sk-...)">
      <button class="secondary" id="theme-toggle-btn" title="切换深色模式">🌙</button>
      <button class="secondary" id="files-btn">文件</button>
      <button class="secondary" id="settings-btn">设置</button>
      <button class="secondary" id="clear-btn">清空当前对话</button>
    </header>

    <div id="together-days-bar" hidden></div>
    <div id="totals-bar"></div>

    <div id="chat"></div>

    <div class="modal-overlay" id="settings-modal" hidden>
      <div class="modal-card">
        <h2>设置</h2>
        <div class="settings-section">
          <label class="settings-label">系统提示词 (System Prompt) — 全局默认，新建对话时使用</label>
          <textarea id="system-prompt-input"></textarea>
        </div>
        <div class="settings-section">
          <label class="settings-label">当前对话的系统提示词——只影响这一个对话，不影响全局默认</label>
          <textarea id="conv-system-prompt-input"></textarea>
        </div>
        <div class="settings-section">
          <label class="settings-label">DeepSeek API Key（备线）</label>
          <input type="password" class="settings-text-input" id="deepseek-api-key-input" placeholder="填入 DeepSeek API Key (sk-...)">
          <span class="toggle-hint">模型选到 DeepSeek Chat / DeepSeek Reasoner 时会改用这个 Key，走 DeepSeek 官方接口（OpenAI 协议），不再用七牛云</span>
        </div>
        <div class="settings-section">
          <label class="settings-label">API 预设 — 记忆库连接</label>
          <label class="toggle-row">
            <input type="checkbox" id="claude-memory-toggle-input">
            <span>Claude 预设：连接 Latent 记忆库
              <span class="toggle-hint">选中 Claude 模型发消息时自动带上历史记忆摘要（需要本地记忆服务已启动）</span>
            </span>
          </label>
          <label class="toggle-row" style="margin-top: 10px;">
            <input type="checkbox" id="deepseek-memory-toggle-input">
            <span>DeepSeek 预设：连接 Latent 记忆库
              <span class="toggle-hint">默认关闭——DeepSeek 走独立的官方接口，跟本机记忆服务没有天然关联</span>
            </span>
          </label>
        </div>
        <div class="settings-section">
          <label class="settings-label">上下文裁剪</label>
          <label class="toggle-row">
            <input type="checkbox" id="context-trim-toggle-input">
            <span>只把最近若干条消息发给模型，更早的自动生成摘要拼进 system prompt
              <span class="toggle-hint">默认关闭：关闭时发送完整历史，不做任何裁剪；开启会额外消耗一次调用来生成/更新摘要</span>
            </span>
          </label>
          <div class="context-trim-count-row">
            <span>保留条数</span>
            <input type="number" id="context-trim-keep-count-input" min="2" max="500" step="1">
          </div>
        </div>
        <div class="settings-section">
          <label class="settings-label">气泡颜色</label>
          <div class="color-row">
            <div class="color-field">
              <input type="color" id="ai-color-input">
              <span>AI 气泡</span>
            </div>
            <div class="color-field">
              <input type="color" id="user-color-input">
              <span>我的气泡</span>
            </div>
            <button type="button" class="secondary" id="reset-colors-btn">恢复默认</button>
          </div>
        </div>
        <div class="settings-section">
          <label class="settings-label">个人资料</label>
          <div class="profile-edit-row">
            <div class="profile-edit-field">
              <img class="profile-avatar-preview" id="user-avatar-preview" title="点击上传头像">
              <input type="file" id="user-avatar-input" accept="image/*" style="display:none">
              <div class="profile-edit-info">
                <span>我的头像 / 网名</span>
                <input type="text" id="user-nickname-input" maxlength="20">
              </div>
            </div>
            <div class="profile-edit-field">
              <img class="profile-avatar-preview" id="ai-avatar-preview" title="点击上传头像">
              <input type="file" id="ai-avatar-input" accept="image/*" style="display:none">
              <div class="profile-edit-info">
                <span>AI 头像 / 网名</span>
                <input type="text" id="ai-nickname-input" maxlength="20">
              </div>
            </div>
          </div>
        </div>
        <div class="settings-section">
          <label class="settings-label">发送图片质量</label>
          <div class="quality-row">
            <input type="range" id="image-quality-input" min="0.3" max="1" step="0.05">
            <span id="image-quality-value"></span>
          </div>
          <span class="toggle-hint">发送前会先压缩到最大宽度 1024px；数值越低文件越小、画质越糊</span>
        </div>
        <div class="settings-section">
          <label class="settings-label">分条发送</label>
          <label class="toggle-row">
            <input type="checkbox" id="split-toggle-input">
            <span>模拟真人分条打字发送
              <span class="toggle-hint">回复不超过 200 字时按换行拆成多条气泡，逐条延迟显示；超过 200 字或关闭此项时整条发送</span>
            </span>
          </label>
        </div>
        <div class="modal-actions">
          <button class="secondary" id="settings-cancel">取消</button>
          <button class="primary" id="settings-save">保存</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="export-modal" hidden>
      <div class="modal-card">
        <h2>导出对话</h2>
        <label class="export-select-row">
          <input type="checkbox" id="export-select-all-input"> 全选
        </label>
        <div class="export-conv-list" id="export-conv-list"></div>
        <div class="modal-actions">
          <button class="secondary" id="export-cancel-btn">取消</button>
          <button class="secondary" id="export-text-only-btn">纯文字</button>
          <button class="primary" id="export-with-images-btn">含图片</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="milestone-modal" hidden>
      <div class="modal-card">
        <h2>里程碑</h2>
        <div class="together-days-row">
          <div class="together-days-count" id="together-days-count"></div>
          <div class="together-days-edit">
            <input type="date" id="together-since-input">
            <button type="button" id="together-since-save">保存纪念日</button>
          </div>
        </div>
        <div class="milestone-list" id="milestone-list"></div>
        <div class="modal-actions">
          <button class="secondary" id="milestone-close">关闭</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="milestone-edit-modal" hidden>
      <div class="modal-card">
        <h2>标记为里程碑</h2>
        <div class="settings-section">
          <label class="settings-label">备注</label>
          <textarea id="milestone-note-input" placeholder="写点什么，记住这一刻…" maxlength="200"></textarea>
        </div>
        <div class="modal-actions">
          <button class="secondary" id="milestone-remove-btn" hidden>取消标记</button>
          <button class="secondary" id="milestone-edit-cancel">取消</button>
          <button class="primary" id="milestone-edit-save">保存</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="diary-modal" hidden>

/* ---------- IndexedDB storage ----------
   对话数据（含图片的 base64）改存 IndexedDB，不再用 localStorage——localStorage
   通常只有几 MB 配额，聊天记录带图片很快就顶满；IndexedDB 常见配额是磁盘可用
   空间的一个大比例（通常是 GB 级别），而且原生异步，存大对象不会卡主线程。 */
const IDB_NAME = 'meiting-chat-db';
const IDB_VERSION = 2;   // v2 加了 diaries store
const IDB_STORE_CONVERSATIONS = 'conversations';
const IDB_STORE_META = 'meta';
const IDB_STORE_DIARIES = 'diaries';
let idbPromise = null;

function openIdb() {
  if (idbPromise) return idbPromise;
  idbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(IDB_STORE_CONVERSATIONS)) {
        db.createObjectStore(IDB_STORE_CONVERSATIONS, { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains(IDB_STORE_META)) {
        db.createObjectStore(IDB_STORE_META);
      }
      if (!db.objectStoreNames.contains(IDB_STORE_DIARIES)) {
        db.createObjectStore(IDB_STORE_DIARIES, { keyPath: 'id' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return idbPromise;
}

async function idbGetAllConversations() {
  const db = await openIdb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE_CONVERSATIONS, 'readonly');
    const req = tx.objectStore(IDB_STORE_CONVERSATIONS).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

async function idbPutConversations(list) {
  if (!list.length) return;
  const db = await openIdb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE_CONVERSATIONS, 'readwrite');
    const store = tx.objectStore(IDB_STORE_CONVERSATIONS);
    for (const c of list) store.put(c);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function idbDeleteConversation(id) {
  const db = await openIdb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE_CONVERSATIONS, 'readwrite');
    tx.objectStore(IDB_STORE_CONVERSATIONS).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function idbGetMeta(key) {
  const db = await openIdb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE_META, 'readonly');
    const req = tx.objectStore(IDB_STORE_META).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idbSetMeta(key, value) {
  const db = await openIdb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE_META, 'readwrite');
    tx.objectStore(IDB_STORE_META).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function idbGetAllDiaries() {
  const db = await openIdb();

    req.onerror = () => reject(req.error);

}

async function idbPutDiary(entry) {
  const db = await openIdb();

    tx.onerror = () => reject(tx.error);

}

async function idbDeleteDiary(id) {

/* ---------- DeepSeek 备线：Key 和当前选中的模型都存 IndexedDB 的 meta 表
   （复用已有的 idbGetMeta/idbSetMeta，不另开新 store）。模型选择原来存在
   localStorage 里，这里做一次性迁移：读到旧值就搬进 IndexedDB 并清掉旧 key，
   之后只认 IndexedDB。 */
async function getDeepseekApiKey() {
  return (await idbGetMeta('deepseekApiKey')) || '';
}
async function setDeepseekApiKey(key) {
  await idbSetMeta('deepseekApiKey', key);
}
async function getSelectedModel() {
  const stored = await idbGetMeta('selectedModel');
  if (stored) return stored;
  const legacy = localStorage.getItem('meiting-chat-model');
  if (legacy) {
    await idbSetMeta('selectedModel', legacy);
    localStorage.removeItem('meiting-chat-model');
    return legacy;
  }
  return DEFAULT_MODEL;
}
async function setSelectedModel(model) {
  await idbSetMeta('selectedModel', model);
}

async function getContextTrimEnabled() {
  return !!(await idbGetMeta('contextTrimEnabled'));
}
async function setContextTrimEnabled(v) {

}
async function getContextTrimKeepCount() {

/* ---------- 记忆库连接：按 API 预设（provider）区分，不是按对话 ----------
   "预设" 目前就是模型下拉框里已经分好的两档——Claude / DeepSeek，还没有更细的
   多预设管理，所以这里按 provider 存一对开关就够了。Claude 默认开、DeepSeek
   默认关（第一次读、IndexedDB 里还没存过值时才用这个默认，不是每次都覆盖）。
   连不连是发送那一刻"当前选中的模型属于哪个 provider"动态判断的，不是在对话
   创建时钉死——同一条对话如果中途把模型从 Claude 切到 DeepSeek，从切换后那条
   消息开始就不再带记忆库内容了，符合"跟 API 预设绑定"而不是"跟对话绑定"。 */
async function getClaudeMemoryConnected() {
  const stored = await idbGetMeta('claudeMemoryConnected');
  return stored === undefined ? true : !!stored;
}
async function setClaudeMemoryConnected(v) {
  await idbSetMeta('claudeMemoryConnected', !!v);
}
async function getDeepseekMemoryConnected() {
  const stored = await idbGetMeta('deepseekMemoryConnected');
  return stored === undefined ? false : !!stored;
}
async function setDeepseekMemoryConnected(v) {
  await idbSetMeta('deepseekMemoryConnected', !!v);
}
async function isMemoryConnectedForCurrentProvider() {
  const provider = getProvider(modelSelectEl.value);
  return provider === 'deepseek' ? getDeepseekMemoryConnected() : getClaudeMemoryConnected();
}

/* ---------- Conversation state ---------- */
let conversations = [];
let currentId = null;
let messages = [];
let pendingImages = [];

function genId() {
  return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function deriveTitle(msg) {
  if (msg && msg.text) return msg.text.slice(0, 24);
  if (msg && msg.images && msg.images.length) return '图片对话';
  return '新对话';
}

/* 老版本存在 localStorage 里的对话数据一次性搬进 IndexedDB，成功后清掉
   localStorage 那几个键，把配额还回去——这正是这次迁移要解决的问题。只在
   IndexedDB 里还没有任何对话时才会走这条路，不会覆盖已经在用 IndexedDB 的数据。 */
async function migrateLocalStorageConversationsIfNeeded() {
  let list = [];
  try {
    const raw = localStorage.getItem('meiting-chat-conversations');
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) list = parsed;
    }
  } catch (e) {}
  if (!list.length) {
    try {
      const oldRaw = localStorage.getItem('meiting-chat-messages');
      if (oldRaw) {
        const oldMessages = JSON.parse(oldRaw);
        if (Array.isArray(oldMessages) && oldMessages.length) {
          list = [{
            id: genId(),
            title: deriveTitle(oldMessages.find(m => m.role === 'user')),
            messages: oldMessages,
            updatedAt: Date.now()
          }];
        }
      }
    } catch (e) {}
  }
  if (list.length) {
    await idbPutConversations(list);
    const oldCurrentId = localStorage.getItem('meiting-chat-current-id');
    if (oldCurrentId) await idbSetMeta('currentId', oldCurrentId);
  }
  localStorage.removeItem('meiting-chat-conversations');
  localStorage.removeItem('meiting-chat-messages');
  localStorage.removeItem('meiting-chat-current-id');
  return list;
}

async function loadConversations() {
  const existing = await idbGetAllConversations();
  if (existing.length) return existing;
  return migrateLocalStorageConversationsIfNeeded();
}

async function saveConversations() {
  await idbPutConversations(conversations);
}

function getCurrentConversation() {
  return conversations.find(c => c.id === currentId);
}

async function createConversation() {
  const conv = {
    id: genId(), title: '新对话', messages: [], updatedAt: Date.now(), memoryContext: '',
    systemPrompt: getSystemPrompt(),   // 继承当时的全局默认，之后这条对话自己独立修改
    historySummary: '', summarizedUpTo: 0   // 上下文裁剪用：还没摘要过任何历史
  };
  conversations.unshift(conv);
  currentId = conv.id;
  await idbSetMeta('currentId', currentId);
  await saveConversations();
  if (await isMemoryConnectedForCurrentProvider()) {
    fetchSessionMemoryFor(conv.id);   // 后台拉记忆，不阻塞新建对话
  }
  return conv;
}

function getMemoryContext() {
  const conv = getCurrentConversation();
  return (conv && conv.memoryContext) || '';
}

/* 新对话建立时自动拉一次历史记忆摘要，存进这条对话自己的 memoryContext——
   之后每条消息发送时都带上，不用每条消息都重新调用 latent_session_start。
   拉取失败（服务没启动/CORS 被拒）不影响正常聊天，只是这条对话拿不到记忆背景。 */
async function fetchSessionMemoryFor(convId) {
  try {
    const text = await callLatentTool('latent_session_start', {});
    const conv = conversations.find(c => c.id === convId);
    if (conv && text) {
      conv.memoryContext = text;
      await saveConversations();
    }
  } catch (e) {
    console.warn('latent_session_start 获取失败：', e.message);
  }
}

async function switchConversation(id) {
  if (id === currentId) return;
  currentId = id;
  await idbSetMeta('currentId', currentId);
  messages = getCurrentConversation().messages;
  renderAll();
  renderSidebar();
  closeSidebarOnMobile();
}

async function deleteConversation(id, evt) {
  if (evt) evt.stopPropagation();
  if (!confirm('确定要删除这个对话吗？此操作无法撤销。')) return;
  const idx = conversations.findIndex(c => c.id === id);
  if (idx === -1) return;
  conversations.splice(idx, 1);
  await idbDeleteConversation(id);
  if (id === currentId) {
    if (conversations.length) {
      currentId = conversations[0].id;
      await idbSetMeta('currentId', currentId);
    } else {
      await createConversation();
    }
    messages = getCurrentConversation().messages;
    renderAll();
  }
  renderSidebar();
}

function renderSidebar() {
  convListEl.innerHTML = '';
  const sorted = [...conversations].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  for (const conv of sorted) {
    const item = document.createElement('div');
    item.className = 'conv-item' + (conv.id === currentId ? ' active' : '');
    const titleEl = document.createElement('span');
    titleEl.className = 'conv-title';
    titleEl.textContent = conv.title || '新对话';
    const delBtn = document.createElement('button');
    delBtn.className = 'conv-delete';
    delBtn.textContent = '×';
    delBtn.title = '删除对话';
    delBtn.addEventListener('click', (e) => deleteConversation(conv.id, e));
    item.appendChild(titleEl);
    item.appendChild(delBtn);
    item.addEventListener('click', () => switchConversation(conv.id));
    convListEl.appendChild(item);
  }
}

newConvBtnEl.addEventListener('click', async () => {
  await createConversation();
  messages = getCurrentConversation().messages;
  renderAll();
  renderSidebar();
  closeSidebarOnMobile();
});

/* ---------- Export / Import ---------- */
function formatDateForFilename(d) {
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function buildExportPayload(mode, ids) {
  const idSet = new Set(ids);
  const convsOut = conversations
    .filter(c => idSet.has(c.id))
    .map(c => {
      const messagesOut = c.messages.map(m => {
        const copy = Object.assign({}, m);
        if (mode === 'text-only') delete copy.images;
        return copy;
      });
      return Object.assign({}, c, { messages: messagesOut });
    });
  return { app: 'meiting-chat', exportedAt: new Date().toISOString(), mode, conversations: convsOut };
}

function downloadJson(obj, filename) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function renderExportConvList() {
  exportConvListEl.innerHTML = '';
  const sorted = [...conversations].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  for (const conv of sorted) {
    const row = document.createElement('label');
    row.className = 'export-conv-item';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = true;
    cb.dataset.convId = conv.id;
    const titleSpan = document.createElement('span');
    titleSpan.textContent = conv.title || '新对话';
    row.appendChild(cb);
    row.appendChild(titleSpan);
    exportConvListEl.appendChild(row);
  }
  exportSelectAllInputEl.checked = true;
}

function getSelectedExportConvIds() {
  return Array.from(exportConvListEl.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.dataset.convId);
}

function exportConversations(mode) {
  const ids = getSelectedExportConvIds();
  if (!ids.length) {
    alert('请至少选择一条对话');
    return;
  }
  const payload = buildExportPayload(mode, ids);
  const suffix = mode === 'text-only' ? '纯文字' : '含图片';
  downloadJson(payload, `meiting-chat-导出-${formatDateForFilename(new Date())}-${suffix}.json`);
  exportModalEl.hidden = true;
}

exportConvBtnEl.addEventListener('click', () => {
  renderExportConvList();
  exportModalEl.hidden = false;
});
exportCancelBtnEl.addEventListener('click', () => { exportModalEl.hidden = true; });
exportModalEl.addEventListener('click', (e) => {
  if (e.target === exportModalEl) exportModalEl.hidden = true;
});
exportSelectAllInputEl.addEventListener('change', () => {

});

exportWithImagesBtnEl.addEventListener('click', () => exportConversations('with-images'));

importConvBtnEl.addEventListener('click', () => importConvInputEl.click());
importConvInputEl.addEventListener('change', async () => {
  const file = importConvInputEl.files && importConvInputEl.files[0];
  importConvInputEl.value = '';
  if (!file) return;
  let payload;
  try {
    const text = await file.text();
    payload = JSON.parse(text);
  } catch (e) {
    alert('导入失败：文件不是合法的 JSON');
    return;
  }
  const list = Array.isArray(payload) ? payload : payload.conversations;
  if (!Array.isArray(list) || !list.length) {
    alert('导入失败：文件里没有找到对话记录');
    return;
  }
  if (!confirm(`确定要导入 ${list.length} 条对话吗？会追加到现有对话列表里，不会覆盖已有对话。`)) return;
  const existingIds = new Set(conversations.map(c => c.id));
  const imported = [];
  for (const conv of list) {
    if (!conv || typeof conv !== 'object' || !Array.isArray(conv.messages)) continue;
    const clone = Object.assign({}, conv);
    if (!clone.id || existingIds.has(clone.id)) clone.id = genId();
    existingIds.add(clone.id);
    if (!clone.title) clone.title = deriveTitle(clone.messages.find(m => m.role === 'user'));
    clone.updatedAt = clone.updatedAt || Date.now();
    conversations.unshift(clone);
    imported.push(clone);
  }
  await saveConversations();
  renderSidebar();
  alert(`导入完成，新增了 ${imported.length} 条对话。`);
});

/* ---------- Together-days counter ---------- */
function getTogetherSince() {
  return localStorage.getItem('meiting-chat-together-since') || '';
}
function setTogetherSince(dateStr) {
  localStorage.setItem('meiting-chat-together-since', dateStr);
}
function computeDaysTogether() {
  const since = getTogetherSince();
  if (!since) return null;
  const start = new Date(since + 'T00:00:00');
  if (isNaN(start.getTime())) return null;
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diffDays = Math.floor((today - start) / 86400000) + 1;
  return diffDays > 0 ? diffDays : null;
}
function renderTogetherDaysBar() {
  const days = computeDaysTogether();
  togetherDaysBarEl.hidden = !days;
  togetherDaysBarEl.textContent = days ? `💕 在一起第 ${days} 天` : '';
}

/* ---------- Milestones (长按/右键消息标记，里程碑时间线) ---------- */
function collectAllMilestones() {
  const out = [];
  for (const conv of conversations) {
    for (const m of conv.messages) {
      if (m.milestone) out.push({ conv, msg: m });
    }
  }
  out.sort((a, b) => (a.msg.milestone.markedAt || 0) - (b.msg.milestone.markedAt || 0));
  return out;
}

function renderMilestoneList() {
  const items = collectAllMilestones();
  milestoneListEl.innerHTML = '';
  if (!items.length) {
    milestoneListEl.innerHTML = '<div class="memory-status">还没有标记任何里程碑，长按（手机）或右键（电脑）一条消息试试。</div>';
    return;
  }
  for (const { msg } of items) {
    const item = document.createElement('div');
    item.className = 'milestone-item';
    const dateEl = document.createElement('div');
    dateEl.className = 'milestone-item-date';
    dateEl.textContent = formatTimestamp(msg.timestamp || msg.milestone.markedAt);
    const textEl = document.createElement('div');
    textEl.className = 'milestone-item-text';
    textEl.textContent = msg.text
      ? msg.text.slice(0, 100)
      : (msg.images && msg.images.length ? '[图片]' : '');
    item.appendChild(dateEl);
    item.appendChild(textEl);
    if (msg.milestone.note) {
      const noteEl = document.createElement('div');
      noteEl.className = 'milestone-item-note';
      noteEl.textContent = `📝 ${msg.milestone.note}`;
      item.appendChild(noteEl);
    }
    milestoneListEl.appendChild(item);
  }
}

function updateTogetherDaysCountDisplay() {
  const days = computeDaysTogether();
  togetherDaysCountEl.textContent = days ? `已经在一起 ${days} 天` : '还没设置纪念日';
}

function openMilestoneModal() {

}

/* ---------- Anniversary reminders (七夕 / 52·520·1314 天 / 整百天) ---------- */
// 农历七夕（七月初七）对应的公历日期，来自维基百科条目 + 多方搜索交叉核对
// （核对于 2026-09）。农历日期每年漂移，这张表只覆盖到 2030 年——之后的年份
// 查不到就不弹七夕提醒，宁可不提醒也不能提醒错日子，需要的话手动查阳历对照表续上。
const QIXI_GREGORIAN_DATES = {
  2024: '08-10', 2025: '08-29', 2026: '08-19', 2027: '08-08',
  2028: '08-26', 2029: '08-16', 2030: '08-05'
};
const SPECIAL_TOGETHER_DAYS = new Set([52, 520, 1314]);

function checkAnniversaryReminders() {
  const now = new Date();
  const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  if (localStorage.getItem('meiting-chat-reminder-last-shown') === todayStr) return;

  const days = computeDaysTogether();
  const mmdd = todayStr.slice(5);
  const isQixi = QIXI_GREGORIAN_DATES[now.getFullYear()] === mmdd;

  let title = null, body = null;
  if (isQixi) {
    title = '💕 七夕快乐';
    body = days ? `今天是七夕，你们已经在一起 ${days} 天了。` : '今天是七夕节呀。';
  } else if (days && SPECIAL_TOGETHER_DAYS.has(days)) {
    title = `💕 在一起 ${days} 天啦`;
    body = '值得记住的一天。';
  } else if (days && days % 100 === 0) {
    title = `💕 在一起 ${days} 天啦`;
    body = '又一个整百天纪念日。';
  }
  if (title) {
    anniversaryTitleEl.textContent = title;
    anniversaryBodyEl.textContent = body;
    anniversaryModalEl.hidden = false;
    localStorage.setItem('meiting-chat-reminder-last-shown', todayStr);
  }
}
anniversaryCloseEl.addEventListener('click', () => { anniversaryModalEl.hidden = true; });

/* ---------- Files browser (per conversation) ----------
   目前应用里能发的附件只有图片（还没有通用文档上传功能），所以"文档"这个筛选
   项现在永远是空列表——不是漏做，是如实反映当前数据里没有非图片附件；以后真
   加了文档发送功能，这里不用改就能接上，因为筛选逻辑是按 media_type 分类的，
   不是写死只认图片。 */
function collectConversationFiles() {
  const out = [];
  messages.forEach((m, msgIndex) => {
    if (!m.images) return;
    m.images.forEach((img, imgIndex) => {
      out.push({
        msgIndex,
        imgIndex,
        name: img.name || `图片_${msgIndex}_${imgIndex}`,
        media_type: img.media_type,
        data: img.data,
        timestamp: m.timestamp || 0
      });
    });
  });
  out.sort((a, b) => a.timestamp - b.timestamp);
  return out;
}

function fileTypeCategory(mediaType) {
  return mediaType && mediaType.startsWith('image/') ? 'image' : 'document';
}

function renderFilesGrid() {
  const keyword = filesFilterKeywordEl.value.trim().toLowerCase();
  const type = filesFilterTypeEl.value;
  const startVal = filesFilterStartEl.value;
  const endVal = filesFilterEndEl.value;
  const startTs = startVal ? new Date(startVal + 'T00:00:00').getTime() : null;
  const endTs = endVal ? new Date(endVal + 'T23:59:59').getTime() : null;

  const filtered = collectConversationFiles().filter(f => {
    if (keyword && !f.name.toLowerCase().includes(keyword)) return false;
    if (type !== 'all' && fileTypeCategory(f.media_type) !== type) return false;
    if (startTs != null && f.timestamp < startTs) return false;
    if (endTs != null && f.timestamp > endTs) return false;
    return true;
  });

  filesGridEl.innerHTML = '';
  if (!filtered.length) {
    filesGridEl.innerHTML = '<div class="files-grid-empty">没有符合条件的文件</div>';
    return;
  }
  for (const f of filtered) {
    const thumb = document.createElement('div');
    thumb.className = 'file-thumb';

    const imgEl = document.createElement('img');
    imgEl.src = `data:${f.media_type};base64,${f.data}`;
    imgEl.title = f.name;
    thumb.appendChild(imgEl);

    const dateEl = document.createElement('div');
    dateEl.className = 'file-thumb-date';
    dateEl.textContent = formatTimestamp(f.timestamp);
    thumb.appendChild(dateEl);

    const actions = document.createElement('div');
    actions.className = 'file-thumb-actions';

    const jumpBtn = document.createElement('button');
    jumpBtn.type = 'button';
    jumpBtn.className = 'file-thumb-action';
    jumpBtn.textContent = '↗';
    jumpBtn.title = '跳转到原消息';
    jumpBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      jumpToMessage(f.msgIndex);
    });
    actions.appendChild(jumpBtn);

    const downloadBtn = document.createElement('button');
    downloadBtn.type = 'button';
    downloadBtn.className = 'file-thumb-action';
    downloadBtn.textContent = '⬇';
    downloadBtn.title = '下载';
    downloadBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      downloadFileItem(f);
    });
    actions.appendChild(downloadBtn);

    const deleteBtn = document.createElement('button');
    deleteBtn.type = 'button';
    deleteBtn.className = 'file-thumb-action file-thumb-action-danger';
    deleteBtn.textContent = '🗑';
    deleteBtn.title = '删除';
    deleteBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!confirm('确定要删除这个文件吗？此操作无法撤销。')) return;
      await deleteFileItem(f);
    });
    actions.appendChild(deleteBtn);

    thumb.appendChild(actions);

    thumb.addEventListener('click', () => openFilePreview(f));
    filesGridEl.appendChild(thumb);
  }
}

function openFilePreview(f) {
  filePreviewImgEl.src = `data:${f.media_type};base64,${f.data}`;
  filePreviewModalEl.hidden = false;
}
filePreviewCloseEl.addEventListener('click', () => { filePreviewModalEl.hidden = true; });
filePreviewModalEl.addEventListener('click', (e) => {

});

function jumpToMessage(msgIndex) {
  filesModalEl.hidden = true;
  const row = chatEl.querySelector(`[data-msg-index="${msgIndex}"]`);
  if (!row) return;
  row.scrollIntoView({ behavior: 'smooth', block: 'center' });
  row.classList.add('msg-highlight');
  setTimeout(() => row.classList.remove('msg-highlight'), 1500);
}

/* base64 -> Blob 直接触发浏览器下载，不经过 data: URL（部分浏览器对超长
   data: URL 的 <a download> 支持不稳定，Blob + objectURL 更可靠）。 */
function downloadFileItem(f) {
  const byteChars = atob(f.data);
  const byteNumbers = new Array(byteChars.length);
  for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
  const blob = new Blob([new Uint8Array(byteNumbers)], { type: f.media_type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = f.name || 'file';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/* f.msgIndex/f.imgIndex 是 collectConversationFiles() 在渲染这个网格时按当前
   messages 数组现算的，删除后立刻重新渲染整个网格（renderFilesGrid），
   后续点击拿到的都是刷新过的下标，不会因为这次删除导致其它按钮下标错位。 */
async function deleteFileItem(f) {
  const m = messages[f.msgIndex];
  if (!m || !m.images) return;
  m.images.splice(f.imgIndex, 1);
  await saveMessages();
  renderAll();
  renderFilesGrid();
}

});

});

});

/* ---------- Diary ---------- */
let diaries = [];

async function loadDiaries() {
  return idbGetAllDiaries();
}

/* AI 回复下面点"保存为日记"调用——存的是整条 m.text（不是拆分出来的某一段），
   并在消息对象自己身上打一个 diarySaved 标记，防止同一条消息被重复存好几份，
   这个标记也要随对话一起存盘，所以调用完还得 saveMessages()。 */
async function saveMessageToDiary(m) {
  const conv = getCurrentConversation();
  const entry = {
    id: genId(),
    convId: conv.id,
    convTitle: conv.title || '新对话',
    content: m.text || '',
    createdAt: Date.now()
  };
  diaries.unshift(entry);
  await idbPutDiary(entry);
  m.diarySaved = true;
  await saveMessages();
}

function populateDiaryConvFilter() {
  const prevValue = diaryFilterConvEl.value;
  diaryFilterConvEl.innerHTML = '<option value="all">全部对话</option>';
  const seen = new Set();
  for (const d of diaries) {
    if (seen.has(d.convId)) continue;
    seen.add(d.convId);
    const opt = document.createElement('option');
    opt.value = d.convId;
    opt.textContent = d.convTitle || '新对话';
    diaryFilterConvEl.appendChild(opt);
  }
  diaryFilterConvEl.value = seen.has(prevValue) ? prevValue : 'all';
}

function renderDiaryList() {
  const convFilter = diaryFilterConvEl.value;
  const startVal = diaryFilterStartEl.value;
  const endVal = diaryFilterEndEl.value;
  const startTs = startVal ? new Date(startVal + 'T00:00:00').getTime() : null;
  const endTs = endVal ? new Date(endVal + 'T23:59:59').getTime() : null;

  const filtered = diaries
    .filter(d => convFilter === 'all' || d.convId === convFilter)
    .filter(d => startTs == null || d.createdAt >= startTs)
    .filter(d => endTs == null || d.createdAt <= endTs)
    .sort((a, b) => b.createdAt - a.createdAt);

  diaryListEl.innerHTML = '';
  if (!filtered.length) {
    diaryListEl.innerHTML = '<div class="memory-status">还没有保存任何日记，AI 回复下面点"保存为日记"试试。</div>';
    return;
  }
  for (const d of filtered) {
    const item = document.createElement('div');
    item.className = 'diary-item';
    const dateEl = document.createElement('div');
    dateEl.className = 'diary-item-date';
    dateEl.textContent = formatTimestamp(d.createdAt);
    const convEl = document.createElement('div');
    convEl.className = 'diary-item-conv';
    convEl.textContent = `来自：${d.convTitle}`;
    const previewEl = document.createElement('div');
    previewEl.className = 'diary-item-preview';
    previewEl.textContent = d.content.length > 120 ? d.content.slice(0, 120) + '…' : d.content;
    item.appendChild(dateEl);
    item.appendChild(convEl);
    item.appendChild(previewEl);
    item.addEventListener('click', () => openDiaryEditModal(d.id));
    diaryListEl.appendChild(item);
  }
}

function openDiaryModal() {
  populateDiaryConvFilter();
  diaryFilterStartEl.value = '';
  diaryFilterEndEl.value = '';
  renderDiaryList();
  diaryModalEl.hidden = false;
}

/* ---------- Latent memory integration ----------
   本地记忆服务只监听 127.0.0.1，走 MCP 的 Streamable HTTP（JSON-RPC over POST）。
   服务端对 Origin 做了 DNS-rebinding 防护，只信任 localhost/127.0.0.1/::1——
   所以这个页面必须通过 http://localhost 之类的地址访问（例如本地起一个静态
   服务器），直接双击用 file:// 打开的话 Origin 是 null，会被服务端拒绝。 */
async function callLatentTool(name, args) {
  const res = await fetch(LATENT_ENDPOINT, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Accept': 'application/json, text/event-stream'
    },
    body: JSON.stringify({
      jsonrpc: '2.0',
      id: Date.now(),
      method: 'tools/call',
      params: { name, arguments: args || {} }
    })
  });
  let data;
  try {
    data = await res.json();
  } catch (e) {
    throw new Error(`HTTP ${res.status}：记忆服务返回的不是合法 JSON`);
  }
  if (!res.ok) {
    throw new Error((data && data.error && data.error.message) || `HTTP ${res.status}`);
  }
  if (data.error) {
    throw new Error(data.error.message || '记忆服务返回错误');
  }
  const result = data.result || {};
  const text = (result.content && result.content[0] && result.content[0].text) || '';
  if (result.isError) {
    throw new Error(text || '记忆服务执行出错');
  }
  return text;
}

function fileToDataUrl(file) {

  });
}

/* Downscales an image data URL so avatars/backgrounds (often multi-MB phone
   photos) don't blow past the localStorage quota once base64-encoded. */
function resizeImageDataUrl(dataUrl, maxSize) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width > maxSize || height > maxSize) {
        if (width > height) {
          height = Math.round(height * maxSize / width);
          width = maxSize;
        } else {
          width = Math.round(width * maxSize / height);
          height = maxSize;
        }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

function hexToRgb(hex) {
  hex = hex.replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  const num = parseInt(hex, 16);
  return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
}
function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  let h, s, l = (max + min) / 2;
  if (max === min) {
    h = s = 0;
  } else {
    const d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    switch (max) {
      case r: h = (g - b) / d + (g < b ? 6 : 0); break;
      case g: h = (b - r) / d + 2; break;
      default: h = (r - g) / d + 4; break;
    }
    h /= 6;
  }
  return { h: h * 360, s: s * 100, l: l * 100 };
}
function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = l - c / 2;
  let r, g, b;
  if (h < 60) { r = c; g = x; b = 0; }
  else if (h < 120) { r = x; g = c; b = 0; }
  else if (h < 180) { r = 0; g = c; b = x; }
  else if (h < 240) { r = 0; g = x; b = c; }
  else if (h < 300) { r = x; g = 0; b = c; }
  else { r = c; g = 0; b = x; }
  const toHex = v => Math.round((v + m) * 255).toString(16).padStart(2, '0');
  return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
}
function darkenForDarkMode(hex) {
  try {
    const { r, g, b } = hexToRgb(hex);
    const { h, s } = rgbToHsl(r, g, b);
    return hslToHex(h, Math.min(s, 45), 24);
  } catch (e) {
    return hex;
  }
}

function applyColors(ai, user) {
  const aiApplied = isDarkMode() ? darkenForDarkMode(ai) : ai;
  const userApplied = isDarkMode() ? darkenForDarkMode(user) : user;
  document.documentElement.style.setProperty('--bubble-ai-bg', aiApplied);
  document.documentElement.style.setProperty('--bubble-user-bg', userApplied);
}

/* ---------- Markdown ---------- */
function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function renderMarkdown(text) {
  if (!text) return '';
  if (window.marked && window.DOMPurify) {
    try {
      window.marked.setOptions({ breaks: true, gfm: true });
      const raw = window.marked.parse(text);
      return window.DOMPurify.sanitize(raw);
    } catch (e) {
      return escapeHtml(text).replace(/\n/g, '<br>');
    }
  }
  return escapeHtml(text).replace(/\n/g, '<br>');
}

/* ---------- Thinking disclosure ---------- */
function buildThinkingPreview(thinking) {
  const compact = thinking.replace(/\s+/g, ' ').trim();
  return compact.length > 30 ? compact.slice(0, 30) + '…' : compact;
}

function buildThinkingDetails(thinkingText) {
  const details = document.createElement('details');
  details.className = 'thinking';
  const summary = document.createElement('summary');
  const arrow = document.createElement('span');
  arrow.className = 'thinking-arrow';
  arrow.textContent = '▸';
  const label = document.createElement('span');
  label.className = 'thinking-label';
  label.textContent = '已思考';
  const preview = document.createElement('span');
  preview.className = 'thinking-preview';
  preview.textContent = buildThinkingPreview(thinkingText);
  summary.appendChild(arrow);
  summary.appendChild(label);
  summary.appendChild(preview);
  const body = document.createElement('div');
  body.className = 'thinking-body';
  body.textContent = thinkingText;
  details.appendChild(summary);
  details.appendChild(body);
  return details;
}

/* ---------- Rendering ---------- */
function splitAiText(text) {
  return (text || '').split(/\n+/).map(s => s.trim()).filter(Boolean);
}

function formatTimestamp(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function formatCurrentTimeForPrompt() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `当前时间：${d.getFullYear()}年${pad(d.getMonth() + 1)}月${pad(d.getDate())}日 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function renderSingleRow(m, textContent, opts) {
  opts = opts || {};
  const role = m.role === 'user' ? 'user' : 'ai';
  const profile = getProfile(role);

  const row = document.createElement('div');
  row.className = 'msg-row ' + role;
  if (opts.msgIndex != null) row.dataset.msgIndex = opts.msgIndex;

  const avatarEl = document.createElement('img');
  avatarEl.className = 'msg-avatar';
  avatarEl.src = profile.avatar || getDefaultAvatar(role, profile.nickname);
  avatarEl.alt = profile.nickname;
  avatarEl.title = profile.nickname;
  avatarEl.addEventListener('click', () => openProfileCard(role));

  const stack = document.createElement('div');
  stack.className = 'msg-stack';

  const nameEl = document.createElement('div');
  nameEl.className = 'msg-nickname';
  nameEl.textContent = profile.nickname;
  stack.appendChild(nameEl);

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (opts.thinking) {
    bubble.appendChild(buildThinkingDetails(opts.thinking));
  }

  if (opts.images && opts.images.length) {
    const imgWrap = document.createElement('div');
    imgWrap.className = 'msg-images';
    for (const img of opts.images) {
      const imEl = document.createElement('img');
      imEl.src = `data:${img.media_type};base64,${img.data}`;
      imgWrap.appendChild(imEl);
    }
    bubble.appendChild(imgWrap);
  }

  if (m.role === 'assistant') {
    if (textContent) {
      const textEl = document.createElement('div');
      textEl.className = 'msg-markdown';
      textEl.innerHTML = renderMarkdown(textContent);
      bubble.appendChild(textEl);
    }
  } else if (textContent) {
    const textEl = document.createElement('div');
    textEl.textContent = textContent;
    bubble.appendChild(textEl);
  }

  if (opts.usage) {
    const usageEl = document.createElement('div');
    usageEl.className = 'msg-usage';
    const thinkingPart = opts.usage.thinking_tokens != null
      ? `思考 ${opts.usage.thinking_tokens}`
      : '思考 未提供';
    usageEl.textContent = `输入 ${opts.usage.input_tokens ?? '-'} · 输出 ${opts.usage.output_tokens ?? '-'} · ${thinkingPart} tokens`;
    bubble.appendChild(usageEl);
  }

  if (opts.timestamp) {
    const timeEl = document.createElement('div');
    timeEl.className = 'msg-time';
    timeEl.textContent = formatTimestamp(opts.timestamp);
    if (m.milestone) {
      const heart = document.createElement('span');
      heart.className = 'milestone-heart';
      heart.textContent = ' ❤️';
      heart.title = m.milestone.note ? `里程碑：${m.milestone.note}` : '里程碑';
      timeEl.appendChild(heart);
    }
    bubble.appendChild(timeEl);
  }

  /* 只在拆出来的最后一段（也就是 usage/timestamp 显示的那一段）挂"保存为日记"
     按钮——一条消息不管被拆成几个气泡，日记只存一份，对应整条 m.text。 */
  if (m.role === 'assistant' && opts.timestamp) {
    const diaryBtn = document.createElement('button');
    diaryBtn.type = 'button';
    diaryBtn.className = 'diary-save-btn';
    diaryBtn.textContent = m.diarySaved ? '📔 已存入日记' : '📔 保存为日记';
    diaryBtn.disabled = !!m.diarySaved;
    diaryBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      await saveMessageToDiary(m);
      diaryBtn.textContent = '📔 已存入日记';
      diaryBtn.disabled = true;
      showToast('已保存到日记');
    });
    bubble.appendChild(diaryBtn);
  }

  attachMilestoneTrigger(bubble, m);

  stack.appendChild(bubble);
  if (role === 'user') {
    row.appendChild(stack);
    row.appendChild(avatarEl);
  } else {
    row.appendChild(avatarEl);
    row.appendChild(stack);
  }
  return row;
}

/* Decides whether an assistant reply should be broken into multiple bubbles:
   only when splitting is enabled in settings AND the whole reply is short. */
function getAssistantSegments(text) {
  const fullText = text || '';
  const shouldSplit = getSplitEnabled() && fullText.length > 0 && fullText.length < SPLIT_MAX_LENGTH;
  if (shouldSplit) {
    return { segments: splitAiText(fullText), split: true };
  }
  const trimmed = fullText.trim();
  return { segments: trimmed ? [trimmed] : [], split: false };
}

function renderMessageRows(m, msgIndex) {
  if (m.role === 'user') {
    return [renderSingleRow(m, m.text, { images: m.images, timestamp: m.timestamp, msgIndex })];
  }
  const { segments } = getAssistantSegments(m.text);
  if (!segments.length) {
    return [renderSingleRow(m, m.text || '', { thinking: m.thinking, usage: m.usage, timestamp: m.timestamp, msgIndex })];
  }
  return segments.map((seg, i) => renderSingleRow(m, seg, {
    thinking: i === 0 ? m.thinking : null,
    usage: i === segments.length - 1 ? m.usage : null,
    timestamp: i === segments.length - 1 ? m.timestamp : null,
    msgIndex
  }));
}

function renderAll() {
  chatEl.innerHTML = '';
  messages.forEach((m, msgIndex) => {
    for (const row of renderMessageRows(m, msgIndex)) chatEl.appendChild(row);
  });
  renderTotalsBar();
  scrollToBottom();
}

function computeTotals() {
  const totals = { input: 0, output: 0, thinking: 0, thinkingKnown: false };
  for (const m of messages) {
    if (m.role === 'assistant' && m.usage) {
      totals.input += m.usage.input_tokens || 0;
      totals.output += m.usage.output_tokens || 0;
      if (m.usage.thinking_tokens != null) {
        totals.thinking += m.usage.thinking_tokens;
        totals.thinkingKnown = true;
      }
    }
  }
  return totals;
}

function renderTotalsBar() {
  const t = computeTotals();
  const thinkingPart = t.thinkingKnown ? `思考 ${t.thinking}` : '思考 未提供';
  totalsBarEl.textContent = `累计消耗 — 输入 ${t.input} · 输出 ${t.output} · ${thinkingPart} tokens`;
}

function scrollToBottom() {
  chatEl.scrollTop = chatEl.scrollHeight;
}
