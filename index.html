function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function revealAssistantMessage(m) {
  const { segments, split } = getAssistantSegments(m.text);

  if (!segments.length) {
    chatEl.appendChild(renderSingleRow(m, m.text || '', { thinking: m.thinking, usage: m.usage, timestamp: m.timestamp }));
    scrollToBottom();
    return;
  }

  if (!split) {
    // Long reply, or splitting turned off in settings: deliver as a single bubble immediately.
    chatEl.appendChild(renderSingleRow(m, segments[0], { thinking: m.thinking, usage: m.usage, timestamp: m.timestamp }));
    scrollToBottom();
    return;
  }

  for (let i = 0; i < segments.length; i++) {
    const typingRow = createTypingRow();
    chatEl.appendChild(typingRow);
    scrollToBottom();
    await sleep(SPLIT_DELAY_MIN_MS + Math.random() * SPLIT_DELAY_RANGE_MS);
    typingRow.remove();
    const row = renderSingleRow(m, segments[i], {
      thinking: i === 0 ? m.thinking : null,
      usage: i === segments.length - 1 ? m.usage : null,
      timestamp: i === segments.length - 1 ? m.timestamp : null
    });
    chatEl.appendChild(row);
    scrollToBottom();
  }
}

/* ---------- Image attach ---------- */
/* 不管原始文件是什么格式，一律经 canvas 重新画一遍导出成 PNG，media_type 固定
   写 image/png——避免用户发的图片原始格式（webp/bmp 等）不在 API 支持列表里
   导致报错。*/
/* 不管原始文件是什么格式，一律经 canvas 重新画一遍：缩到最大宽度 IMAGE_MAX_WIDTH
   （不放大小图），按设置里的质量滑块导出成 JPEG——JPEG 才有"质量"这个概念，
   PNG 是无损格式，quality 参数对它不起作用。media_type 固定写 image/jpeg，
   同时也顺带解决了原始格式不在 API 支持列表里导致报错的问题。 */
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let width = img.naturalWidth;
        let height = img.naturalHeight;
        if (width > IMAGE_MAX_WIDTH) {
          height = Math.round(height * IMAGE_MAX_WIDTH / width);
          width = IMAGE_MAX_WIDTH;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', getImageQuality());
        const base64 = dataUrl.substring(dataUrl.indexOf(',') + 1);
        resolve({ media_type: 'image/jpeg', data: base64, name: file.name || '粘贴的图片.png' });
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------- Voice input (Web Speech API) ----------
   识别结果只填进输入框，从不自动发送——用户看一眼确认没转错字，自己按发送。 */
const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
let speechRecognition = null;
let isRecording = false;
let textBeforeRecording = '';

micBtnEl.addEventListener('click', () => {
  if (!SpeechRecognitionCtor) {
    showToast('当前浏览器不支持语音输入');
    return;
  }
  if (isRecording) {
    speechRecognition.stop();
    return;
  }
  textBeforeRecording = textInputEl.value;
  let finalTranscript = '';
  speechRecognition = new SpeechRecognitionCtor();
  speechRecognition.lang = 'zh-CN';
  speechRecognition.continuous = true;
  speechRecognition.interimResults = true;
  speechRecognition.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const transcript = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalTranscript += transcript;
      else interim += transcript;
    }
    textInputEl.value = textBeforeRecording + finalTranscript + interim;
    textInputEl.style.height = 'auto';
    textInputEl.style.height = Math.min(textInputEl.scrollHeight, 140) + 'px';
  };
  speechRecognition.onerror = (e) => {
    showToast('语音识别出错：' + (e.error || '未知错误'));
  };
  speechRecognition.onend = () => {
    isRecording = false;
    micBtnEl.classList.remove('recording');
  };
  try {
    speechRecognition.start();
    isRecording = true;
    micBtnEl.classList.add('recording');
  } catch (e) {
    showToast('无法启动语音识别');
  }
});

imgBtnEl.addEventListener('click', () => imgInputEl.click());

/* 图片按钮选图、Ctrl+V 粘贴、拖拽进来的图片都走这一个函数，统一压缩流程。 */
async function addImageFiles(files) {
  const imageFiles = files.filter(f => f.type && f.type.startsWith('image/'));
  for (const file of imageFiles) {
    const b64 = await fileToBase64(file);
    pendingImages.push(b64);
  }
  if (imageFiles.length) renderPreview();
  return imageFiles.length;
}

imgInputEl.addEventListener('change', async () => {
  await addImageFiles(Array.from(imgInputEl.files || []));
  imgInputEl.value = '';
});

/* ---------- Paste image from clipboard ---------- */
textInputEl.addEventListener('paste', async (e) => {

  const imageFiles = items
    .filter(it => it.kind === 'file' && it.type.startsWith('image/'))
    .map(it => it.getAsFile())
    .filter(Boolean);
  if (!imageFiles.length) return;   // 普通文字粘贴，交给默认行为
  e.preventDefault();
  await addImageFiles(imageFiles);
});

/* ---------- Drag & drop image onto the page ---------- */
let dragCounter = 0;
function dragHasFiles(e) {
  return Array.from(e.dataTransfer.types || []).includes('Files');
}
document.addEventListener('dragenter', (e) => {
  if (!dragHasFiles(e)) return;
  e.preventDefault();
  dragCounter++;
  dropOverlayEl.hidden = false;
});
document.addEventListener('dragover', (e) => {
  if (!dragHasFiles(e)) return;
  e.preventDefault();
});
document.addEventListener('dragleave', () => {
  dragCounter = Math.max(0, dragCounter - 1);
  if (dragCounter === 0) dropOverlayEl.hidden = true;
});
document.addEventListener('drop', async (e) => {
  if (!dragHasFiles(e)) return;
  e.preventDefault();
  dragCounter = 0;
  dropOverlayEl.hidden = true;
  const files = Array.from(e.dataTransfer.files || []);
  const added = await addImageFiles(files);
  if (!added && files.length) showToast('拖入的文件里没有图片');
});

const API_ACCEPTED_IMAGE_TYPES = new Set(['image/jpeg', 'image/png', 'image/gif', 'image/webp']);

/* 老对话里可能存着 PNG 转换修复之前发的图，media_type 是当年浏览器上报的原始
   file.type（可能是 API 不收的格式，甚至空字符串），但数据本身是能正常显示的
   合法图片——不然聊天记录里早就看不到了。这里补一次 canvas 转 PNG，把 img
   对象原地改成 image/png，之后这条消息就一直是修好的，不用每次发送都重转。 */
function normalizeImageForApi(img) {
  if (API_ACCEPTED_IMAGE_TYPES.has(img.media_type)) return Promise.resolve(img);
  return new Promise((resolve) => {
    const image = new Image();
    image.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = image.naturalWidth;
      canvas.height = image.naturalHeight;
      canvas.getContext('2d').drawImage(image, 0, 0);
      const dataUrl = canvas.toDataURL('image/png');
      img.media_type = 'image/png';
      img.data = dataUrl.substring(dataUrl.indexOf(',') + 1);
      resolve(img);
    };
    image.onerror = () => resolve(img);   // 转不了就原样发，让 API 按原样报错
    image.src = `data:${img.media_type || 'application/octet-stream'};base64,${img.data}`;
  });
}

async function buildApiMessages(sourceMessages) {
  const out = [];
  for (const m of sourceMessages) {
    if (m.streaming) continue;
    const blocks = [];
    if (m.images) {
      for (const img of m.images) {
        await normalizeImageForApi(img);
        blocks.push({ type: 'image', source: { type: 'base64', media_type: img.media_type, data: img.data } });
      }
    }
    if (m.text) {
      blocks.push({ type: 'text', text: m.text });
    }
    out.push({ role: m.role, content: blocks });
  }
  return out;
}

/* ---------- Context trimming + auto-summary ----------
   关闭（默认）：发完整历史，system prompt 就是 [独立prompt, 记忆库摘要, 当前时间]。
   开启：只把最近 keepCount 条发给模型，更早、还没被摘要覆盖到的那一段先调一次
   模型把它们浓缩进 conv.historySummary（跟旧摘要融合，不是从零重写），再把
   system prompt 拼成 [独立prompt, 记忆库摘要, 历史摘要, 当前时间]。summarizedUpTo
   记录已经摘要到 messages 数组的第几条，避免同一段历史被反复摘要。 */
async function buildSystemPromptText() {
  const enabled = await getContextTrimEnabled();
  const conv = getCurrentConversation();
  const parts = [getConvSystemPrompt()];
  if (await isMemoryConnectedForCurrentProvider()) {
    parts.push(getMemoryContext());
  }
  if (enabled && conv && conv.historySummary) {
    parts.push(`【历史摘要】\n${conv.historySummary}`);
  }
  parts.push(formatCurrentTimeForPrompt());
  return parts.filter(Boolean).join('\n\n');
}

async function callClaudePlain(model, apiKey, userText) {
  const res = await fetch(CLAUDE_API_ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01' },
    body: JSON.stringify({
      model,
      max_tokens: SUMMARY_MAX_TOKENS,
      stream: false,
      messages: [{ role: 'user', content: [{ type: 'text', text: userText }] }]
    })
  });
  if (!res.ok) throw new ApiHttpError(await readHttpErrorMessage(res));
  const data = await res.json();
  const block = data.content && data.content.find(b => b.type === 'text');
  return (block && block.text) || '';
}

async function callDeepseekPlain(model, apiKey, userText) {
  const res = await fetch(DEEPSEEK_API_ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
    body: JSON.stringify({
      model,
      stream: false,
      max_tokens: SUMMARY_MAX_TOKENS,
      messages: [{ role: 'user', content: userText }]
    })
  });
  if (!res.ok) throw new ApiHttpError(await readHttpErrorMessage(res));
  const data = await res.json();
  return (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '';
}

/* 用当前选中的模型/provider 做一次非流式调用来生成或更新摘要；没配对应的 key
   或请求失败都不让发送流程中断——原样退回旧摘要，这一段历史下次再重试摘要。 */
async function generateSummary(previousSummary, msgsToSummarize) {
  const model = modelSelectEl.value;
  const provider = getProvider(model);
  const apiKey = provider === 'deepseek' ? await getDeepseekApiKey() : apiKeyEl.value.trim();
  if (!apiKey) return { ok: false, summary: previousSummary };

  const transcript = msgsToSummarize.map(m => {
    const who = m.role === 'user' ? '用户' : 'AI';
    const body = m.text || (m.images && m.images.length ? '[图片]' : '');
    return `${who}：${body}`;
  }).join('\n');
  const instruction = previousSummary
    ? `已有的历史摘要：\n${previousSummary}\n\n请把下面新增的对话内容也融合进这段摘要，输出更新后的完整摘要（保留关键事实和上下文，不超过 300 字，不要编造没提到的内容）：\n\n${transcript}`
    : `请把下面这段对话总结成一段摘要（保留关键事实和上下文，不超过 300 字，不要编造没提到的内容）：\n\n${transcript}`;

  try {
    const summary = provider === 'deepseek'
      ? await callDeepseekPlain(model, apiKey, instruction)
      : await callClaudePlain(model, apiKey, instruction);
    return { ok: true, summary: summary || previousSummary };
  } catch (e) {
    console.warn('生成历史摘要失败：', e.message);
    return { ok: false, summary: previousSummary };
  }
}

async function maybeSummarizeOldMessages(keepCount) {
  const conv = getCurrentConversation();
  const summarizedUpTo = conv.summarizedUpTo || 0;
  const overflowEnd = messages.length - keepCount;
  if (overflowEnd <= summarizedUpTo) return;
  const toSummarize = messages.slice(summarizedUpTo, overflowEnd).filter(m => !m.streaming);
  if (!toSummarize.length) {
    conv.summarizedUpTo = overflowEnd;
    return;
  }
  const result = await generateSummary(conv.historySummary || '', toSummarize);
  if (result.ok) {
    conv.historySummary = result.summary;
    conv.summarizedUpTo = overflowEnd;
    await saveMessages();
  }
  // 摘要失败：summarizedUpTo 原地不动，下次发送再重试，这次照常用裁剪前的状态发送
}

async function getMessagesToSend() {
  const enabled = await getContextTrimEnabled();
  if (!enabled) return messages;
  const keepCount = await getContextTrimKeepCount();
  await maybeSummarizeOldMessages(keepCount);
  return messages.slice(-keepCount);
}

/* ---------- Streaming send ---------- */
/* HTTP 层面的错误（比如 401/400，服务器给了明确回应）用这个类型抛出，
   跟网络层错误（连不上/被墙/DNS 失败之类，fetch 自己抛的）分开，好让最终
   展示给用户的提示文案分别说"请求出错"还是"网络请求失败"——两种 provider
   共用同一套外层 try/catch，靠这个类型区分，不用各自重复一份错误处理。 */
class ApiHttpError extends Error {}

async function readHttpErrorMessage(res) {
  try {
    const data = await res.json();
    return (data && data.error && (data.error.message || data.error)) || JSON.stringify(data);
  } catch (e) {
    return `HTTP ${res.status}`;
  }
}

async function sendToClaude(model, apiKey, assistantMsg) {
  const sourceMessages = await getMessagesToSend();
  const apiMessages = await buildApiMessages(sourceMessages);
  await saveMessages();      // 落盘任何被 normalizeImageForApi 原地修好的旧图片，以及新生成的摘要

  const res = await fetch(CLAUDE_API_ENDPOINT, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01'
    },
    body: JSON.stringify({
      model,
      max_tokens: MAX_TOKENS,
      system: await buildSystemPromptText(),
      thinking: THINKING_CONFIG_BY_MODEL[model] || { type: 'adaptive' },
      stream: true,
      messages: apiMessages
    })
  });
  if (!res.ok) throw new ApiHttpError(await readHttpErrorMessage(res));

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const events = buffer.split('\n\n');
    buffer = events.pop();
    for (const evt of events) {
      if (!evt.trim()) continue;
      let dataStr = '';
      for (const line of evt.split('\n')) {
        if (line.startsWith('data:')) dataStr += line.slice(5).trim();
      }
      if (!dataStr) continue;
      let data;
      try { data = JSON.parse(dataStr); } catch (e) { continue; }
      applyStreamEvent(data, assistantMsg);
    }
  }
}

/* DeepSeek 走 OpenAI 协议：system prompt 是消息数组里第一条 role:'system'，
   不是 Anthropic 那种独立的顶层字段；图片消息只带文字部分——deepseek-chat/
   deepseek-reasoner 都不支持图文输入，sendMessage() 里已经提前挡掉带图片
   发送的情况，这里再兜底一次单纯不把图片塞进去，不会报错也不会丢文字。 */
async function buildDeepseekMessages(sourceMessages) {
  const sysPrompt = await buildSystemPromptText();
  const out = [];
  if (sysPrompt) out.push({ role: 'system', content: sysPrompt });
  for (const m of sourceMessages) {
    if (m.streaming || !m.text) continue;
    out.push({ role: m.role, content: m.text });
  }
  return out;
}

function applyDeepseekStreamEvent(data, msg) {
  const delta = data.choices && data.choices[0] && data.choices[0].delta;
  if (delta) {
    if (delta.reasoning_content) msg.thinking = (msg.thinking || '') + delta.reasoning_content;
    if (delta.content) msg.text = (msg.text || '') + delta.content;
  }
  if (data.usage) {
    msg.usage = msg.usage || {};
    if (data.usage.prompt_tokens != null) msg.usage.input_tokens = data.usage.prompt_tokens;
    if (data.usage.completion_tokens != null) msg.usage.output_tokens = data.usage.completion_tokens;
  }
}

async function sendToDeepseek(model, apiKey, assistantMsg) {
  const sourceMessages = await getMessagesToSend();
  const dsMessages = await buildDeepseekMessages(sourceMessages);
  await saveMessages();      // 落盘可能新生成的摘要

  const res = await fetch(DEEPSEEK_API_ENDPOINT, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${apiKey}`
    },
    body: JSON.stringify({
      model,
      messages: dsMessages,
      stream: true,
      max_tokens: MAX_TOKENS
    })
  });
  if (!res.ok) throw new ApiHttpError(await readHttpErrorMessage(res));

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const events = buffer.split('\n\n');
    buffer = events.pop();
    for (const evt of events) {
      if (!evt.trim()) continue;
      let dataStr = '';
      for (const line of evt.split('\n')) {
        if (line.startsWith('data:')) dataStr += line.slice(5).trim();
      }
      if (!dataStr || dataStr === '[DONE]') continue;
      let data;
      try { data = JSON.parse(dataStr); } catch (e) { continue; }
      applyDeepseekStreamEvent(data, assistantMsg);
    }
  }
}

async function sendMessage() {
  const text = textInputEl.value.trim();
  if (!text && pendingImages.length === 0) return;

  const model = modelSelectEl.value;
  const provider = getProvider(model);

  if (provider === 'deepseek' && pendingImages.length > 0) {
    alert('DeepSeek 模型不支持图片，请先移除待发送的图片，或切换回 Claude 模型。');
    return;
  }

  const apiKey = provider === 'deepseek' ? await getDeepseekApiKey() : apiKeyEl.value.trim();
  if (!apiKey) {
    alert(provider === 'deepseek' ? '请先在设置里填入 DeepSeek API Key' : '请先在顶部填入 API Key');
    return;
  }

  const userMsg = { role: 'user', text, images: pendingImages, timestamp: Date.now() };
  messages.push(userMsg);
  await saveMessages();
  renderAll();

  textInputEl.value = '';
  textInputEl.style.height = 'auto';
  pendingImages = [];
  renderPreview();

  const assistantMsg = { role: 'assistant', text: '', thinking: '', usage: null, streaming: true };
  messages.push(assistantMsg);

  setSendingState(true);
  const typingRow = createTypingRow();
  chatEl.appendChild(typingRow);
  scrollToBottom();

  try {
    if (provider === 'deepseek') {
      await sendToDeepseek(model, apiKey, assistantMsg);
    } else {
      await sendToClaude(model, apiKey, assistantMsg);
    }
    assistantMsg.streaming = false;
    assistantMsg.timestamp = Date.now();
    typingRow.remove();
    await revealAssistantMessage(assistantMsg);
    await saveMessages();
    renderTotalsBar();
  } catch (err) {
    typingRow.remove();
    messages.pop();
    const label = err instanceof ApiHttpError ? '请求出错' : '网络请求失败';
    messages.push({ role: 'assistant', text: `⚠️ ${label}：${err.message}`, timestamp: Date.now() });
    await saveMessages();
    renderAll();
  } finally {
    setSendingState(false);
  }
}

function applyStreamEvent(data, msg) {
  switch (data.type) {
    case 'message_start':
      if (data.message && data.message.usage) {
        msg.usage = msg.usage || {};
        msg.usage.input_tokens = data.message.usage.input_tokens ?? null;
      }
      break;
    case 'content_block_delta':
      if (data.delta && data.delta.type === 'thinking_delta') {
        msg.thinking = (msg.thinking || '') + (data.delta.thinking || '');
      } else if (data.delta && data.delta.type === 'text_delta') {
        msg.text = (msg.text || '') + (data.delta.text || '');
      }
      break;
    case 'message_delta':
      if (data.usage) {
        msg.usage = msg.usage || {};
        if (data.usage.output_tokens != null) msg.usage.output_tokens = data.usage.output_tokens;
        if (data.usage.thinking_tokens != null) msg.usage.thinking_tokens = data.usage.thinking_tokens;
      }
      break;
    case 'error':
      msg.text = (msg.text || '') + `\n\n⚠️ 流式请求出错：${(data.error && data.error.message) || '未知错误'}`;
      break;
    default:
      break;
  }
}

/* ---------- Boot ---------- */
async function boot() {
  modelSelectEl.value = await getSelectedModel();
  conversations = await loadConversations();
  diaries = await loadDiaries();
  currentId = await idbGetMeta('currentId');
  if (!conversations.length) {
    await createConversation();
  } else if (!currentId || !conversations.some(c => c.id === currentId)) {
    currentId = conversations[0].id;
    await idbSetMeta('currentId', currentId);
  }
  messages = getCurrentConversation().messages;
  renderSidebar();
  renderAll();
  renderTogetherDaysBar();
  checkAnniversaryReminders();
}
boot();
</script>
