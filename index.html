<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Meiting Chat</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root {
    --bg: #eef8f6;
    --bg-2: #e3f3ef;
    --panel-bg: rgba(255,255,255,0.72);
    --surface: #ffffff;
    --surface-hover: #f3fbfa;
    --accent: #3fa392;
    --accent-hover: #328579;
    --text: #2f3d3a;
    --text-soft: #7d928d;
    --border-soft: #cfe6e0;
    --bubble-ai-bg: #dceeff;
    --bubble-user-bg: #dcf6e1;
    --bubble-border: rgba(25, 45, 40, 0.10);
    --thinking-bg: #eef4f6;
    --thinking-border: #cfe1e6;
    --thinking-accent: #5c7d86;
    --disabled-bg: #bcd9d3;
    --danger-hover-bg: #fde2e2;
    --danger-hover-text: #c0574f;
  }
  :root[data-theme="dark"] {
    --bg: #141e1b;
    --bg-2: #0f1715;
    --panel-bg: rgba(20, 30, 27, 0.75);
    --surface: #1c2925;
    --surface-hover: #24332e;
    --accent: #4fc2ae;
    --accent-hover: #63d1bd;
    --text: #e7f2ef;
    --text-soft: #93aaa5;
    --border-soft: #2b3f3a;
    --bubble-border: rgba(255, 255, 255, 0.08);
    --thinking-bg: #1c2b28;
    --thinking-border: #33473f;
    --thinking-accent: #8fb4bb;
    --disabled-bg: #2b3d38;
    --danger-hover-bg: #3a2323;
    --danger-hover-text: #e08b83;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    color: var(--text);
    overflow: hidden;
    transition: background 0.2s ease, color 0.2s ease;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #app {
    display: flex;
    flex-direction: row;
    height: 100vh;
    height: 100dvh;
  }

  /* ---------- Sidebar ---------- */
  #sidebar {
    width: 260px;
    flex-shrink: 0;
    background: var(--panel-bg);
    border-right: 1px solid var(--border-soft);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    margin-left: -260px;
    transition: margin-left 0.22s ease;
  }
  #app.sidebar-open #sidebar { margin-left: 0; }
  #sidebar-header {
    padding: 12px;
    border-bottom: 1px solid var(--border-soft);
  }
  #new-conv-btn {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    font-size: 13px;
  }
  #new-conv-btn:hover:not(:disabled) { background: var(--accent-hover); }
  #nav-menu {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 8px;
    border-bottom: 1px solid var(--border-soft);
    flex-shrink: 0;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 9px 12px;
    border-radius: 10px;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    text-align: left;
  }
  .nav-item:hover { background: rgba(63, 163, 146, 0.10); }
  .nav-item.active {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    font-weight: 600;
    color: var(--accent);
  }
  .nav-icon { font-size: 15px; width: 18px; text-align: center; flex-shrink: 0; }
  #conv-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  #conv-list.disabled { pointer-events: none; opacity: 0.55; }
  .conv-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text);
    margin-bottom: 4px;
  }
  .conv-item:hover { background: rgba(63, 163, 146, 0.10); }
  .conv-item.active {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    font-weight: 600;
  }
  .conv-title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .conv-delete {
    border: none;
    background: transparent;
    color: var(--text-soft);
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    padding: 4px 7px;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .conv-delete:hover { background: var(--danger-hover-bg); color: var(--danger-hover-text); }

  #sidebar-backdrop { display: none; }

  /* ---------- Main column ---------- */
  #main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
  }

  header {
    padding: 14px 20px;
    background: var(--panel-bg);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--border-soft);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    color: var(--accent);
    white-space: nowrap;
  }
  header input[type="password"], header input[type="text"] {
    flex: 1;
    min-width: 160px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid var(--border-soft);
    background: var(--surface);
    font-size: 13px;
    outline: none;
    color: var(--text);
  }
  header input[type="password"]:focus, header input[type="text"]:focus { border-color: var(--accent); }
  header select {
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid var(--border-soft);
    background: var(--surface);
    font-size: 13px;
    outline: none;
    color: var(--text);
    cursor: pointer;
    flex-shrink: 0;
  }
  header button {
    padding: 8px 14px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  header button:hover:not(:disabled) { background: var(--accent-hover); }
  header button.secondary {
    background: transparent;
    color: var(--text-soft);
    border: 1px solid var(--border-soft);
  }
  header button.secondary:hover:not(:disabled) { background: var(--surface); color: var(--accent); }
  #sidebar-toggle-btn, #theme-toggle-btn {
    width: 38px;
    height: 38px;
    padding: 0;
    font-size: 16px;
    flex-shrink: 0;
  }

  #totals-bar {
    text-align: center;
    font-size: 12px;
    color: var(--text-soft);
    padding: 6px 12px;
    background: rgba(255,255,255,0.5);
    border-bottom: 1px solid var(--border-soft);
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 20px 12%;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .msg-row {
    display: flex;
    width: 100%;
    gap: 8px;
    align-items: flex-start;
  }
  .msg-row.ai { justify-content: flex-start; }
  .msg-row.user { justify-content: flex-end; }

  .msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    cursor: pointer;
    border: 1px solid var(--border-soft);
    background: var(--surface);
  }

  .msg-stack {
    display: flex;
    flex-direction: column;
    max-width: 72%;
    min-width: 0;
  }
  .msg-row.ai .msg-stack { align-items: flex-start; }
  .msg-row.user .msg-stack { align-items: flex-end; }

  .msg-nickname {
    font-size: 11.5px;
    color: var(--text-soft);
    margin-bottom: 3px;
    padding: 0 4px;
  }

  .bubble {
    max-width: 100%;
    padding: 12px 16px;
    border-radius: 18px;
    line-height: 1.55;
    font-size: 14.5px;
    word-break: break-word;
    box-shadow: 0 2px 6px rgba(60, 90, 80, 0.08);
    border: 1px solid var(--bubble-border);
    color: var(--text);
  }
  .msg-row.ai .bubble {
    background: var(--bubble-ai-bg);
    border-top-left-radius: 4px;
  }
  .msg-row.user .bubble {
    background: var(--bubble-user-bg);
    border-top-right-radius: 4px;
    white-space: pre-wrap;
  }

  .msg-images {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 8px;
  }
  .msg-images img {
    max-width: 160px;
    max-height: 160px;
    border-radius: 10px;
    object-fit: cover;
    border: 1px solid rgba(0,0,0,0.08);
  }

  /* ---------- Typing indicator ---------- */
  .typing-bubble {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .typing-label {
    font-size: 12.5px;
    color: var(--text-soft);
    font-style: italic;
  }
  .typing-dots { display: inline-flex; gap: 4px; }
  .typing-dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-soft);
    animation: typing-bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typing-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* ---------- Markdown rendering ---------- */
  .msg-markdown p { margin: 0 0 8px 0; }
  .msg-markdown p:last-child { margin-bottom: 0; }
  .msg-markdown ul, .msg-markdown ol { margin: 4px 0 8px 22px; padding: 0; }
  .msg-markdown li { margin-bottom: 4px; }
  .msg-markdown h1, .msg-markdown h2, .msg-markdown h3, .msg-markdown h4 {
    margin: 12px 0 6px; color: var(--accent-hover); line-height: 1.3;
  }
  .msg-markdown h1:first-child, .msg-markdown h2:first-child, .msg-markdown h3:first-child { margin-top: 0; }
  .msg-markdown h1 { font-size: 18px; }
  .msg-markdown h2 { font-size: 16.5px; }
  .msg-markdown h3 { font-size: 15px; }
  .msg-markdown code {
    background: rgba(0,0,0,0.07);
    padding: 2px 5px;
    border-radius: 5px;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 0.88em;
  }
  .msg-markdown pre {
    background: #26343a;
    color: #eaf5f2;
    padding: 12px 14px;
    border-radius: 10px;
    overflow-x: auto;
    margin: 8px 0;
  }
  .msg-markdown pre code { background: none; padding: 0; color: inherit; }
  .msg-markdown blockquote {
    border-left: 3px solid var(--border-soft);
    margin: 8px 0; padding: 2px 12px; color: var(--text-soft);
  }
  .msg-markdown a { color: var(--accent-hover); }
  .msg-markdown table { border-collapse: collapse; margin: 8px 0; max-width: 100%; display: block; overflow-x: auto; }
  .msg-markdown th, .msg-markdown td { border: 1px solid var(--border-soft); padding: 4px 8px; }
  .msg-markdown hr { border: none; border-top: 1px solid var(--border-soft); margin: 10px 0; }

  /* ---------- Thinking disclosure (claude.ai style) ---------- */
  details.thinking {
    margin-bottom: 10px;
    background: var(--thinking-bg);
    border: 1px solid var(--thinking-border);
    border-radius: 10px;
    padding: 0 10px;
  }
  details.thinking summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 9px 0;
    outline: none;
    user-select: none;
  }
  details.thinking summary::-webkit-details-marker { display: none; }
  .thinking-arrow {
    display: inline-block;
    font-size: 10px;
    color: var(--thinking-accent);
    transition: transform 0.18s ease;
    flex-shrink: 0;
  }
  details.thinking[open] .thinking-arrow { transform: rotate(90deg); }
  .thinking-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--thinking-accent);
    flex-shrink: 0;
  }
  .thinking-preview {
    font-size: 12px;
    color: var(--text-soft);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
  }
  details.thinking[open] .thinking-preview { display: none; }
  .thinking-body {
    font-size: 12.5px;
    color: var(--text-soft);
    white-space: pre-wrap;
    line-height: 1.5;
    border-top: 1px dashed var(--thinking-border);
    padding: 8px 0 10px;
  }

  .status {
    text-align: center;
    color: var(--text-soft);
    font-size: 12.5px;
    padding: 4px 0;
  }

  .msg-usage {
    margin-top: 8px;
    font-size: 11px;
    color: var(--text-soft);
    opacity: 0.85;
  }
  .msg-time {
    margin-top: 4px;
    font-size: 10.5px;
    color: var(--text-soft);
    opacity: 0.7;
  }

  footer {
    padding: 12px 12%;
    background: var(--panel-bg);
    border-top: 1px solid var(--border-soft);
  }
  #preview-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .preview-thumb {
    position: relative;
    width: 56px;
    height: 56px;
  }
  .preview-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--border-soft);
  }
  .preview-thumb .remove {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 12px;
    line-height: 18px;
    text-align: center;
    cursor: pointer;
  }
  #input-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
  }
  #input-row textarea {
    flex: 1;
    resize: none;
    border-radius: 16px;
    border: 1px solid var(--border-soft);
    padding: 10px 14px;
    font-size: 14.5px;
    font-family: inherit;
    outline: none;
    max-height: 140px;
    min-height: 42px;
    background: var(--surface);
    color: var(--text);
  }
  #input-row textarea:focus { border-color: var(--accent); }
  .icon-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid var(--border-soft);
    background: var(--surface);
    color: var(--text-soft);
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--surface-hover); }
  #send-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #send-btn:disabled {
    background: var(--disabled-bg);
    cursor: not-allowed;
  }
  #send-btn:hover:not(:disabled) { background: var(--accent-hover); }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(30, 50, 45, 0.32);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 300;
  }
  .modal-overlay[hidden] { display: none; }
  .modal-card {
    background: var(--surface);
    border-radius: 16px;
    border: 1px solid var(--border-soft);
    padding: 20px;
    width: min(520px, 90vw);
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 8px 24px rgba(40, 70, 60, 0.18);
  }
  .modal-card h2 {
    margin: 0 0 14px 0;
    font-size: 16px;
    color: var(--accent);
  }
  .settings-section { margin-bottom: 18px; }
  .settings-section:last-of-type { margin-bottom: 0; }
  .settings-label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-soft);
    margin-bottom: 8px;
  }
  .modal-card textarea {
    width: 100%;
    min-height: 130px;
    border-radius: 12px;
    border: 1px solid var(--border-soft);
    padding: 10px 12px;
    font-size: 13.5px;
    font-family: inherit;
    resize: vertical;
    outline: none;
    color: var(--text);
    background: var(--surface);
  }
  .modal-card textarea:focus { border-color: var(--accent); }
  .color-row {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
  }
  .color-field {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text);
  }
  .color-field input[type="color"] {
    width: 34px;
    height: 34px;
    padding: 0;
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    cursor: pointer;
    background: none;
  }
  #reset-colors-btn {
    margin-left: auto;
    padding: 7px 12px;
    font-size: 12px;
  }
  .toggle-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    line-height: 1.4;
  }
  .toggle-row input[type="checkbox"] {
    width: 18px;
    height: 18px;
    margin-top: 1px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }
  .toggle-hint {
    display: block;
    font-size: 11.5px;
    color: var(--text-soft);
    margin-top: 2px;
  }

  /* ---------- Profile editing (in settings) ---------- */
  .profile-edit-row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .profile-edit-field {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 180px;
  }
  .profile-avatar-preview {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    object-fit: cover;
    cursor: pointer;
    border: 1px solid var(--border-soft);
    flex-shrink: 0;
    background: var(--surface);
  }
  .profile-edit-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
    min-width: 0;
  }
  .profile-edit-info span {
    font-size: 11px;
    color: var(--text-soft);
  }
  .profile-edit-info input[type="text"] {
    padding: 6px 9px;
    border-radius: 8px;
    border: 1px solid var(--border-soft);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    outline: none;
    width: 100%;
  }
  .profile-edit-info input[type="text"]:focus { border-color: var(--accent); }

  /* ---------- Profile card (click an avatar) ---------- */
  .profile-card { width: min(380px, 90vw); }
  .profile-bg {
    margin: -20px -20px 0 -20px;
    height: 110px;
    border-radius: 16px 16px 0 0;
    background: linear-gradient(135deg, var(--bubble-ai-bg), var(--bubble-user-bg));
    background-size: cover;
    background-position: center;
    position: relative;
  }
  .profile-bg-btn {
    position: absolute;
    right: 10px;
    bottom: 10px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: rgba(0, 0, 0, 0.45);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  .profile-bg-btn:hover { background: rgba(0, 0, 0, 0.6); }
  .profile-card-body {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .profile-card-avatar {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid var(--surface);
    margin-top: -42px;
    background: var(--surface);
    cursor: pointer;
    position: relative;
    z-index: 1;
  }
  .profile-card-name {
    margin-top: 10px;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    text-align: center;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    padding: 4px 8px;
    font-family: inherit;
    outline: none;
    width: 100%;
    box-sizing: border-box;
  }
  .profile-card-name:hover, .profile-card-name:focus { border-color: var(--border-soft); background: var(--surface); }
  .profile-card-bio {
    width: 100%;
    margin-top: 10px;
    min-height: 50px;
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
    color: var(--text-soft);
    background: var(--surface);
    resize: vertical;
    outline: none;
    text-align: center;
    box-sizing: border-box;
  }
  .profile-card-bio:focus { border-color: var(--accent); }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
  }
  .modal-actions button {
    padding: 8px 16px;
    border-radius: 10px;
    border: none;
    font-size: 13px;
    cursor: pointer;
  }
  .modal-actions .primary { background: var(--accent); color: #fff; }
  .modal-actions .primary:hover { background: var(--accent-hover); }
  .modal-actions .secondary { background: transparent; color: var(--text-soft); border: 1px solid var(--border-soft); }
  .modal-actions .secondary:hover { background: var(--surface-hover); }

  /* ---------- Memory library (记忆库) ---------- */

<script>
const API_ENDPOINT = "https://api.qnaigc.com/v1/messages";
const LATENT_ENDPOINT = "http://127.0.0.1:8765/mcp";
const MAX_TOKENS = 8000;
const THINKING_CONFIG_BY_MODEL = {
  'claude-opus-4-6': { type: 'adaptive', display: 'summarized' },
  'claude-sonnet-4-20250514': { type: 'enabled', budget_tokens: 4000 }
};

const DEFAULT_SYSTEM_PROMPT = '你必须使用中文进行思考（thinking），思考链和回复都用中文。';
const DEFAULT_AI_COLOR = '#dceeff';
const DEFAULT_USER_COLOR = '#dcf6e1';
const SPLIT_MAX_LENGTH = 200;

const SPLIT_DELAY_RANGE_MS = 700;
const DEFAULT_PROFILES = {
  user: { avatar: null, nickname: '美婷', bio: '', background: null },
  ai: { avatar: null, nickname: 'cc', bio: '', background: null }
};

/* ---------- DOM refs ---------- */
const appEl = document.getElementById('app');

const modelSelectEl = document.getElementById('model-select');
const textInputEl = document.getElementById('text-input');
const sendBtnEl = document.getElementById('send-btn');
const imgBtnEl = document.getElementById('img-btn');
const imgInputEl = document.getElementById('img-input');

const totalsBarEl = document.getElementById('totals-bar');
const themeToggleBtnEl = document.getElementById('theme-toggle-btn');
const settingsBtnEl = document.getElementById('settings-btn');
const settingsModalEl = document.getElementById('settings-modal');
const systemPromptInputEl = document.getElementById('system-prompt-input');
const settingsSaveEl = document.getElementById('settings-save');
const settingsCancelEl = document.getElementById('settings-cancel');
const aiColorInputEl = document.getElementById('ai-color-input');
const userColorInputEl = document.getElementById('user-color-input');
const resetColorsBtnEl = document.getElementById('reset-colors-btn');
const splitToggleInputEl = document.getElementById('split-toggle-input');
const userAvatarPreviewEl = document.getElementById('user-avatar-preview');
const userAvatarInputEl = document.getElementById('user-avatar-input');
const userNicknameInputEl = document.getElementById('user-nickname-input');
const aiAvatarPreviewEl = document.getElementById('ai-avatar-preview');
const aiAvatarInputEl = document.getElementById('ai-avatar-input');
const aiNicknameInputEl = document.getElementById('ai-nickname-input');
const profileModalEl = document.getElementById('profile-modal');
const profileBgEl = document.getElementById('profile-bg');
const profileBgBtnEl = document.getElementById('profile-bg-btn');
const profileBgInputEl = document.getElementById('profile-bg-input');
const profileCardAvatarEl = document.getElementById('profile-card-avatar');
const profileCardAvatarInputEl = document.getElementById('profile-card-avatar-input');
const profileCardNameEl = document.getElementById('profile-card-name');
const profileCardBioEl = document.getElementById('profile-card-bio');
const profileCardCloseEl = document.getElementById('profile-card-close');

/* ---------- Conversation state ---------- */
let conversations = loadConversations();
let currentId = localStorage.getItem('meiting-chat-current-id');
if (!conversations.length) {
  createConversation();
} else if (!currentId || !conversations.some(c => c.id === currentId)) {
  currentId = conversations[0].id;
  localStorage.setItem('meiting-chat-current-id', currentId);
}
let messages = getCurrentConversation().messages;
let pendingImages = [];

function genId() {
  return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function deriveTitle(msg) {
  if (msg && msg.text) return msg.text.slice(0, 24);
  if (msg && msg.images && msg.images.length) return '图片对话';
  return '新对话';
}

function loadConversations() {
  try {
    const raw = localStorage.getItem('meiting-chat-conversations');
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) return parsed;
    }
  } catch (e) {}
  try {
    const oldRaw = localStorage.getItem('meiting-chat-messages');
    if (oldRaw) {
      const oldMessages = JSON.parse(oldRaw);
      if (Array.isArray(oldMessages) && oldMessages.length) {
        const conv = {
          id: genId(),
          title: deriveTitle(oldMessages.find(m => m.role === 'user')),
          messages: oldMessages,
          updatedAt: Date.now()
        };
        localStorage.removeItem('meiting-chat-messages');
        localStorage.setItem('meiting-chat-conversations', JSON.stringify([conv]));
        return [conv];
      }
    }
  } catch (e) {}
  return [];
}

function saveConversations() {
  localStorage.setItem('meiting-chat-conversations', JSON.stringify(conversations));
}

function getCurrentConversation() {
  return conversations.find(c => c.id === currentId);
}

function createConversation() {
  const conv = { id: genId(), title: '新对话', messages: [], updatedAt: Date.now(), memoryContext: '' };
  conversations.unshift(conv);
  currentId = conv.id;
  localStorage.setItem('meiting-chat-current-id', currentId);
  saveConversations();
  fetchSessionMemoryFor(conv.id);
  return conv;
}

function getMemoryContext() {
  const conv = getCurrentConversation();
  return (conv && conv.memoryContext) || '';
}

/* 新对话建立时自动拉一次历史记忆摘要，存进这条对话自己的 memoryContext——
   之后每条消息发送时都带上，不用每条消息都重新调用 latent_session_start。
   拉取失败（服务没启动/CORS 被拒）不影响正常聊天，只是这条对话拿不到记忆背景。 */
async function fetchSessionMemoryFor(convId) {
  try {
    const text = await callLatentTool('latent_session_start', {});
    const conv = conversations.find(c => c.id === convId);
    if (conv && text) {
      conv.memoryContext = text;
      saveConversations();
    }
  } catch (e) {
    console.warn('latent_session_start 获取失败：', e.message);
  }
}

function switchConversation(id) {
  if (id === currentId) return;
  currentId = id;
  localStorage.setItem('meiting-chat-current-id', currentId);
  messages = getCurrentConversation().messages;
  renderAll();
  renderSidebar();
  closeSidebarOnMobile();
}

function deleteConversation(id, evt) {
  if (evt) evt.stopPropagation();
  if (!confirm('确定要删除这个对话吗？此操作无法撤销。')) return;
  const idx = conversations.findIndex(c => c.id === id);
  if (idx === -1) return;
  conversations.splice(idx, 1);
  if (id === currentId) {
    if (conversations.length) {
      currentId = conversations[0].id;
      localStorage.setItem('meiting-chat-current-id', currentId);
    } else {
      createConversation();
    }
    messages = getCurrentConversation().messages;
    renderAll();
  }
  saveConversations();
  renderSidebar();
}

function renderSidebar() {
  convListEl.innerHTML = '';
  const sorted = [...conversations].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  for (const conv of sorted) {
    const item = document.createElement('div');
    item.className = 'conv-item' + (conv.id === currentId ? ' active' : '');
    const titleEl = document.createElement('span');
    titleEl.className = 'conv-title';
    titleEl.textContent = conv.title || '新对话';
    const delBtn = document.createElement('button');
    delBtn.className = 'conv-delete';
    delBtn.textContent = '×';
    delBtn.title = '删除对话';
    delBtn.addEventListener('click', (e) => deleteConversation(conv.id, e));
    item.appendChild(titleEl);
    item.appendChild(delBtn);
    item.addEventListener('click', () => switchConversation(conv.id));
    convListEl.appendChild(item);
  }
}

newConvBtnEl.addEventListener('click', () => {
  createConversation();
  messages = getCurrentConversation().messages;
  renderAll();
  renderSidebar();
  closeSidebarOnMobile();
});

/* ---------- Toast ---------- */
let toastTimer = null;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
}

/* ---------- Latent memory integration ----------
   本地记忆服务只监听 127.0.0.1，走 MCP 的 Streamable HTTP（JSON-RPC over POST）。
   服务端对 Origin 做了 DNS-rebinding 防护，只信任 localhost/127.0.0.1/::1——
   所以这个页面必须通过 http://localhost 之类的地址访问（例如本地起一个静态
   服务器），直接双击用 file:// 打开的话 Origin 是 null，会被服务端拒绝。 */
async function callLatentTool(name, args) {
  const res = await fetch(LATENT_ENDPOINT, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Accept': 'application/json, text/event-stream'
    },
    body: JSON.stringify({
      jsonrpc: '2.0',
      id: Date.now(),
      method: 'tools/call',
      params: { name, arguments: args || {} }
    })
  });
  let data;
  try {
    data = await res.json();
  } catch (e) {
    throw new Error(`HTTP ${res.status}：记忆服务返回的不是合法 JSON`);
  }
  if (!res.ok) {
    throw new Error((data && data.error && data.error.message) || `HTTP ${res.status}`);
  }
  if (data.error) {
    throw new Error(data.error.message || '记忆服务返回错误');
  }
  const result = data.result || {};
  const text = (result.content && result.content[0] && result.content[0].text) || '';
  if (result.isError) {
    throw new Error(text || '记忆服务执行出错');
  }
  return text;
}

/* ---------- Memory library modal (手动搜索) ---------- */
function openMemoryModal() {
  memoryResultsEl.innerHTML = '';
  memorySearchInputEl.value = '';
  memoryModalEl.hidden = false;
  memorySearchInputEl.focus();
}
function closeMemoryModal() {
  memoryModalEl.hidden = true;
}
memoryCloseEl.addEventListener('click', closeMemoryModal);
memoryModalEl.addEventListener('click', (e) => {
  if (e.target === memoryModalEl) closeMemoryModal();
});

async function runMemorySearch() {
  const query = memorySearchInputEl.value.trim();
  if (!query) return;
  memorySearchBtnEl.disabled = true;
  memoryResultsEl.innerHTML = '<div class="memory-status">搜索中…</div>';
  try {
    const text = await callLatentTool('latent_search', { query, topN: 8 });
    const item = document.createElement('div');
    item.className = 'memory-result-item';
    item.textContent = text || '没有找到相关记忆。';
    memoryResultsEl.innerHTML = '';
    memoryResultsEl.appendChild(item);
  } catch (e) {
    memoryResultsEl.innerHTML =
      `<div class="memory-status">搜索失败：${escapeHtml(e.message)}（请确认本地记忆服务已启动，`
      + `且本页面是通过 http://localhost 访问，而不是直接打开本地文件）</div>`;
  } finally {
    memorySearchBtnEl.disabled = false;
  }
}
memorySearchBtnEl.addEventListener('click', runMemorySearch);
memorySearchInputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    runMemorySearch();
  }
});

/* ---------- Nav menu ---------- */
navMenuEl.addEventListener('click', (e) => {
  const btn = e.target.closest('.nav-item');
  if (!btn) return;
  if (btn.dataset.nav === 'chat') {
    closeSidebarOnMobile();
    return;
  }
  if (btn.dataset.nav === 'memory') {
    openMemoryModal();
    closeSidebarOnMobile();
    return;
  }
  showToast('功能开发中');
});

/* ---------- Sidebar open/close ---------- */
let sidebarOpen = window.innerWidth > 800;
function applySidebarState() {
  appEl.classList.toggle('sidebar-open', sidebarOpen);
}
function closeSidebarOnMobile() {
  if (window.innerWidth <= 800) {
    sidebarOpen = false;
    applySidebarState();
  }
}
sidebarToggleBtnEl.addEventListener('click', () => {
  sidebarOpen = !sidebarOpen;
  applySidebarState();
});
sidebarBackdropEl.addEventListener('click', () => {
  sidebarOpen = false;
  applySidebarState();
});
applySidebarState();
renderSidebar();

/* ---------- Sending-state lock (prevents switching conversations mid-reply) ---------- */
function setSendingState(isSending) {
  sendBtnEl.disabled = isSending;
  newConvBtnEl.disabled = isSending;
  clearBtnEl.disabled = isSending;
  convListEl.classList.toggle('disabled', isSending);
}

/* ---------- API key / model ---------- */
apiKeyEl.value = localStorage.getItem('meiting-chat-api-key') || '';
apiKeyEl.addEventListener('input', () => {
  localStorage.setItem('meiting-chat-api-key', apiKeyEl.value);
});

modelSelectEl.value = localStorage.getItem('meiting-chat-model') || DEFAULT_MODEL;
modelSelectEl.addEventListener('change', () => {
  localStorage.setItem('meiting-chat-model', modelSelectEl.value);
});

function getSystemPrompt() {
  const stored = localStorage.getItem('meiting-chat-system-prompt');
  return stored !== null ? stored : DEFAULT_SYSTEM_PROMPT;
}

function getSplitEnabled() {
  const stored = localStorage.getItem('meiting-chat-split-enabled');

}

/* ---------- Profiles (avatar / nickname / bio / background) ---------- */
function getProfile(role) {
  try {
    const raw = localStorage.getItem(`meiting-chat-profile-${role}`);
    if (raw) {
      return Object.assign({}, DEFAULT_PROFILES[role], JSON.parse(raw));
    }
  } catch (e) {}
  return Object.assign({}, DEFAULT_PROFILES[role]);
}

function saveProfile(role, profile) {
  try {
    localStorage.setItem(`meiting-chat-profile-${role}`, JSON.stringify(profile));
    return true;
  } catch (e) {
    // Most likely the avatar/background image pushed this over the localStorage quota.
    // Retry without the image so the nickname/bio the user just typed isn't lost too.
    try {
      localStorage.setItem(`meiting-chat-profile-${role}`, JSON.stringify(Object.assign({}, profile, { avatar: null, background: null })));
    } catch (e2) {}
    alert('图片过大，本地存储空间不足，头像/背景图未能保存；昵称等其他修改已保存。请更换更小的图片后重试。');
    return false;
  }
}

function escapeXml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function getDefaultAvatar(role, nickname) {
  const fallback = role === 'user' ? '美' : 'c';
  const initial = escapeXml(((nickname || fallback).trim().charAt(0) || fallback).toUpperCase());
  const bg = role === 'user' ? '#8fd6ab' : '#8fc3ea';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><rect width="64" height="64" rx="32" fill="${bg}"/><text x="32" y="42" font-size="26" font-family="sans-serif" text-anchor="middle" fill="#ffffff">${initial}</text></svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* Downscales an image data URL so avatars/backgrounds (often multi-MB phone
   photos) don't blow past the localStorage quota once base64-encoded. */
function resizeImageDataUrl(dataUrl, maxSize) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width > maxSize || height > maxSize) {
        if (width > height) {
          height = Math.round(height * maxSize / width);
          width = maxSize;
        } else {
          width = Math.round(width * maxSize / height);
          height = maxSize;
        }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

function hexToRgb(hex) {
  hex = hex.replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  const num = parseInt(hex, 16);
  return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
}
function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  let h, s, l = (max + min) / 2;
  if (max === min) {
    h = s = 0;
  } else {
    const d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    switch (max) {
      case r: h = (g - b) / d + (g < b ? 6 : 0); break;
      case g: h = (b - r) / d + 2; break;
      default: h = (r - g) / d + 4; break;
    }
    h /= 6;
  }
  return { h: h * 360, s: s * 100, l: l * 100 };
}
function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = l - c / 2;
  let r, g, b;
  if (h < 60) { r = c; g = x; b = 0; }
  else if (h < 120) { r = x; g = c; b = 0; }
  else if (h < 180) { r = 0; g = c; b = x; }
  else if (h < 240) { r = 0; g = x; b = c; }
  else if (h < 300) { r = x; g = 0; b = c; }
  else { r = c; g = 0; b = x; }
  const toHex = v => Math.round((v + m) * 255).toString(16).padStart(2, '0');
  return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
}
function darkenForDarkMode(hex) {
  try {
    const { r, g, b } = hexToRgb(hex);
    const { h, s } = rgbToHsl(r, g, b);
    return hslToHex(h, Math.min(s, 45), 24);
  } catch (e) {
    return hex;
  }
}

function applyColors(ai, user) {
  const aiApplied = isDarkMode() ? darkenForDarkMode(ai) : ai;
  const userApplied = isDarkMode() ? darkenForDarkMode(user) : user;
  document.documentElement.style.setProperty('--bubble-ai-bg', aiApplied);
  document.documentElement.style.setProperty('--bubble-user-bg', userApplied);
}

/* ---------- Markdown ---------- */
function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function renderMarkdown(text) {
  if (!text) return '';
  if (window.marked && window.DOMPurify) {
    try {
      window.marked.setOptions({ breaks: true, gfm: true });
      const raw = window.marked.parse(text);
      return window.DOMPurify.sanitize(raw);
    } catch (e) {
      return escapeHtml(text).replace(/\n/g, '<br>');
    }
  }
  return escapeHtml(text).replace(/\n/g, '<br>');
}

/* ---------- Thinking disclosure ---------- */
function buildThinkingPreview(thinking) {
  const compact = thinking.replace(/\s+/g, ' ').trim();
  return compact.length > 30 ? compact.slice(0, 30) + '…' : compact;
}

function buildThinkingDetails(thinkingText) {
  const details = document.createElement('details');
  details.className = 'thinking';
  const summary = document.createElement('summary');
  const arrow = document.createElement('span');
  arrow.className = 'thinking-arrow';
  arrow.textContent = '▸';
  const label = document.createElement('span');
  label.className = 'thinking-label';
  label.textContent = '已思考';
  const preview = document.createElement('span');
  preview.className = 'thinking-preview';
  preview.textContent = buildThinkingPreview(thinkingText);
  summary.appendChild(arrow);
  summary.appendChild(label);
  summary.appendChild(preview);
  const body = document.createElement('div');
  body.className = 'thinking-body';
  body.textContent = thinkingText;
  details.appendChild(summary);
  details.appendChild(body);
  return details;
}

/* ---------- Rendering ---------- */
function splitAiText(text) {
  return (text || '').split(/\n+/).map(s => s.trim()).filter(Boolean);
}

function formatTimestamp(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function formatCurrentTimeForPrompt() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `当前时间：${d.getFullYear()}年${pad(d.getMonth() + 1)}月${pad(d.getDate())}日 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function renderSingleRow(m, textContent, opts) {
  opts = opts || {};
  const role = m.role === 'user' ? 'user' : 'ai';
  const profile = getProfile(role);

  const row = document.createElement('div');
  row.className = 'msg-row ' + role;

  const avatarEl = document.createElement('img');
  avatarEl.className = 'msg-avatar';
  avatarEl.src = profile.avatar || getDefaultAvatar(role, profile.nickname);
  avatarEl.alt = profile.nickname;
  avatarEl.title = profile.nickname;
  avatarEl.addEventListener('click', () => openProfileCard(role));

  const stack = document.createElement('div');
  stack.className = 'msg-stack';

  const nameEl = document.createElement('div');
  nameEl.className = 'msg-nickname';
  nameEl.textContent = profile.nickname;
  stack.appendChild(nameEl);

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (opts.thinking) {
    bubble.appendChild(buildThinkingDetails(opts.thinking));
  }

  if (opts.images && opts.images.length) {
    const imgWrap = document.createElement('div');
    imgWrap.className = 'msg-images';
    for (const img of opts.images) {
      const imEl = document.createElement('img');
      imEl.src = `data:${img.media_type};base64,${img.data}`;
      imgWrap.appendChild(imEl);
    }
    bubble.appendChild(imgWrap);
  }

  if (m.role === 'assistant') {
    if (textContent) {
      const textEl = document.createElement('div');
      textEl.className = 'msg-markdown';
      textEl.innerHTML = renderMarkdown(textContent);
      bubble.appendChild(textEl);
    }
  } else if (textContent) {
    const textEl = document.createElement('div');
    textEl.textContent = textContent;
    bubble.appendChild(textEl);
  }

  if (opts.usage) {
    const usageEl = document.createElement('div');
    usageEl.className = 'msg-usage';
    const thinkingPart = opts.usage.thinking_tokens != null
      ? `思考 ${opts.usage.thinking_tokens}`
      : '思考 未提供';
    usageEl.textContent = `输入 ${opts.usage.input_tokens ?? '-'} · 输出 ${opts.usage.output_tokens ?? '-'} · ${thinkingPart} tokens`;
    bubble.appendChild(usageEl);
  }

  if (opts.timestamp) {
    const timeEl = document.createElement('div');
    timeEl.className = 'msg-time';
    timeEl.textContent = formatTimestamp(opts.timestamp);
    bubble.appendChild(timeEl);
  }

  stack.appendChild(bubble);
  if (role === 'user') {
    row.appendChild(stack);
    row.appendChild(avatarEl);
  } else {
    row.appendChild(avatarEl);
    row.appendChild(stack);
  }
  return row;
}

/* Decides whether an assistant reply should be broken into multiple bubbles:
   only when splitting is enabled in settings AND the whole reply is short. */
function getAssistantSegments(text) {
  const fullText = text || '';
  const shouldSplit = getSplitEnabled() && fullText.length > 0 && fullText.length < SPLIT_MAX_LENGTH;
  if (shouldSplit) {
    return { segments: splitAiText(fullText), split: true };
  }
  const trimmed = fullText.trim();
  return { segments: trimmed ? [trimmed] : [], split: false };
}

function renderMessageRows(m) {
  if (m.role === 'user') {
    return [renderSingleRow(m, m.text, { images: m.images, timestamp: m.timestamp })];
  }
  const { segments } = getAssistantSegments(m.text);
  if (!segments.length) {
    return [renderSingleRow(m, m.text || '', { thinking: m.thinking, usage: m.usage, timestamp: m.timestamp })];
  }
  return segments.map((seg, i) => renderSingleRow(m, seg, {
    thinking: i === 0 ? m.thinking : null,
    usage: i === segments.length - 1 ? m.usage : null,
    timestamp: i === segments.length - 1 ? m.timestamp : null
  }));
}

function renderAll() {
  chatEl.innerHTML = '';
  for (const m of messages) {
    for (const row of renderMessageRows(m)) chatEl.appendChild(row);
  }
  renderTotalsBar();
  scrollToBottom();
}

function computeTotals() {
  const totals = { input: 0, output: 0, thinking: 0, thinkingKnown: false };
  for (const m of messages) {
    if (m.role === 'assistant' && m.usage) {
      totals.input += m.usage.input_tokens || 0;
      totals.output += m.usage.output_tokens || 0;
      if (m.usage.thinking_tokens != null) {
        totals.thinking += m.usage.thinking_tokens;
        totals.thinkingKnown = true;
      }
    }
  }
  return totals;
}

function renderTotalsBar() {
  const t = computeTotals();
  const thinkingPart = t.thinkingKnown ? `思考 ${t.thinking}` : '思考 未提供';
  totalsBarEl.textContent = `累计消耗 — 输入 ${t.input} · 输出 ${t.output} · ${thinkingPart} tokens`;
}

function scrollToBottom() {
  chatEl.scrollTop = chatEl.scrollHeight;
}

/* ---------- Typing indicator + staged reveal ---------- */
function createTypingRow() {
  const profile = getProfile('ai');
  const row = document.createElement('div');
  row.className = 'msg-row ai';

  const avatarEl = document.createElement('img');
  avatarEl.className = 'msg-avatar';
  avatarEl.src = profile.avatar || getDefaultAvatar('ai', profile.nickname);
  avatarEl.alt = profile.nickname;
  avatarEl.addEventListener('click', () => openProfileCard('ai'));

  const stack = document.createElement('div');
  stack.className = 'msg-stack';

  const bubble = document.createElement('div');
  bubble.className = 'bubble typing-bubble';
  const label = document.createElement('span');
  label.className = 'typing-label';
  label.textContent = '对方正在输入';
  const dots = document.createElement('span');
  dots.className = 'typing-dots';
  dots.innerHTML = '<span></span><span></span><span></span>';
  bubble.appendChild(label);
  bubble.appendChild(dots);

  stack.appendChild(bubble);
  row.appendChild(avatarEl);
  row.appendChild(stack);
  return row;
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function revealAssistantMessage(m) {
  const { segments, split } = getAssistantSegments(m.text);

  if (!segments.length) {
    chatEl.appendChild(renderSingleRow(m, m.text || '', { thinking: m.thinking, usage: m.usage, timestamp: m.timestamp }));
    scrollToBottom();
    return;
  }

  if (!split) {
    // Long reply, or splitting turned off in settings: deliver as a single bubble immediately.
    chatEl.appendChild(renderSingleRow(m, segments[0], { thinking: m.thinking, usage: m.usage, timestamp: m.timestamp }));
    scrollToBottom();
    return;
  }

  for (let i = 0; i < segments.length; i++) {
    const typingRow = createTypingRow();
    chatEl.appendChild(typingRow);
    scrollToBottom();
    await sleep(SPLIT_DELAY_MIN_MS + Math.random() * SPLIT_DELAY_RANGE_MS);
    typingRow.remove();
    const row = renderSingleRow(m, segments[i], {
      thinking: i === 0 ? m.thinking : null,
      usage: i === segments.length - 1 ? m.usage : null,
      timestamp: i === segments.length - 1 ? m.timestamp : null
    });
    chatEl.appendChild(row);
    scrollToBottom();
  }
}

/* ---------- Image attach ---------- */
/* 不管原始文件是什么格式，一律经 canvas 重新画一遍导出成 PNG，media_type 固定
   写 image/png——避免用户发的图片原始格式（webp/bmp 等）不在 API 支持列表里
   导致报错。*/
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        const dataUrl = canvas.toDataURL('image/png');
        const base64 = dataUrl.substring(dataUrl.indexOf(',') + 1);
        resolve({ media_type: 'image/png', data: base64 });
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

textInputEl.addEventListener('input', () => {
  textInputEl.style.height = 'auto';
  textInputEl.style.height = Math.min(textInputEl.scrollHeight, 140) + 'px';
});

textInputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

sendBtnEl.addEventListener('click', sendMessage);

clearBtnEl.addEventListener('click', () => {
  if (confirm('确定要清空当前对话的聊天记录吗？')) {
    messages.length = 0;
    saveMessages();
    renderAll();
  }
});

function buildApiMessages() {
  return messages
    .filter(m => !m.streaming)
    .map(m => {
      const blocks = [];
      if (m.images) {
        for (const img of m.images) {
          blocks.push({ type: 'image', source: { type: 'base64', media_type: img.media_type, data: img.data } });
        }
      }
      if (m.text) {
        blocks.push({ type: 'text', text: m.text });
      }
      return { role: m.role, content: blocks };
    });
}

/* ---------- Streaming send ---------- */
async function sendMessage() {
  const text = textInputEl.value.trim();
  if (!text && pendingImages.length === 0) return;

  const apiKey = apiKeyEl.value.trim();
  if (!apiKey) {
    alert('请先在顶部填入 API Key');
    return;
  }

  const userMsg = { role: 'user', text, images: pendingImages, timestamp: Date.now() };
  messages.push(userMsg);
  saveMessages();
  renderAll();

  textInputEl.value = '';
  textInputEl.style.height = 'auto';
  pendingImages = [];
  renderPreview();

  const apiMessages = buildApiMessages();

  const assistantMsg = { role: 'assistant', text: '', thinking: '', usage: null, streaming: true };
  messages.push(assistantMsg);

  setSendingState(true);
  const typingRow = createTypingRow();
  chatEl.appendChild(typingRow);
  scrollToBottom();

  try {
    const res = await fetch(API_ENDPOINT, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01'
      },
      body: JSON.stringify({
        model: modelSelectEl.value,
        max_tokens: MAX_TOKENS,
        system: [getSystemPrompt(), getMemoryContext(), formatCurrentTimeForPrompt()].filter(Boolean).join('\n\n'),
        thinking: THINKING_CONFIG_BY_MODEL[modelSelectEl.value] || { type: 'adaptive' },
        stream: true,
        messages: apiMessages
      })
    });

    if (!res.ok) {
      let errMsg;
      try {
        const data = await res.json();
        errMsg = (data && data.error && data.error.message) || JSON.stringify(data);
      } catch (e) {
        errMsg = `HTTP ${res.status}`;
      }
      typingRow.remove();
      messages.pop();
      messages.push({ role: 'assistant', text: `⚠️ 请求出错：${errMsg}`, timestamp: Date.now() });
      saveMessages();
      renderAll();
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const events = buffer.split('\n\n');
      buffer = events.pop();

      for (const evt of events) {
        if (!evt.trim()) continue;
        let dataStr = '';
        for (const line of evt.split('\n')) {
          if (line.startsWith('data:')) dataStr += line.slice(5).trim();
        }
        if (!dataStr) continue;
        let data;
        try { data = JSON.parse(dataStr); } catch (e) { continue; }
        applyStreamEvent(data, assistantMsg);
      }
    }

    assistantMsg.streaming = false;
    assistantMsg.timestamp = Date.now();
    typingRow.remove();
    await revealAssistantMessage(assistantMsg);
    saveMessages();
    renderTotalsBar();
  } catch (err) {
    typingRow.remove();
    messages.pop();
    messages.push({ role: 'assistant', text: `⚠️ 网络请求失败：${err.message}`, timestamp: Date.now() });
    saveMessages();
    renderAll();
  } finally {
    setSendingState(false);
  }
}

function applyStreamEvent(data, msg) {
  switch (data.type) {
    case 'message_start':
      if (data.message && data.message.usage) {
        msg.usage = msg.usage || {};
        msg.usage.input_tokens = data.message.usage.input_tokens ?? null;
      }
      break;
    case 'content_block_delta':
      if (data.delta && data.delta.type === 'thinking_delta') {
        msg.thinking = (msg.thinking || '') + (data.delta.thinking || '');
      } else if (data.delta && data.delta.type === 'text_delta') {
        msg.text = (msg.text || '') + (data.delta.text || '');
      }
      break;
    case 'message_delta':
      if (data.usage) {
        msg.usage = msg.usage || {};
        if (data.usage.output_tokens != null) msg.usage.output_tokens = data.usage.output_tokens;
        if (data.usage.thinking_tokens != null) msg.usage.thinking_tokens = data.usage.thinking_tokens;
      }
      break;
    case 'error':
      msg.text = (msg.text || '') + `\n\n⚠️ 流式请求出错：${(data.error && data.error.message) || '未知错误'}`;
      break;
    default:
      break;
  }
}

renderAll();
</script>
</body>
